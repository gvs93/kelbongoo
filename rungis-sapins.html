<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sapins — récupération</title>
<!-- rungis-sapins.html v1.1 (22/11/2026 : adresse du script en dur, plus de lecture de la base) · v1.0 (18/11/2026) — page des boutons du mail de 2 h « À récupérer chez Cruard ».
     Remplace la page script.google.com (plantait sur téléphone connecté à plusieurs comptes Google).
     Parle au script SAPINS (v1.13+) en POST : rungis-info / rungis-confirm / rungis-move. Jeton signé dans le lien (t). -->
<style>
body{font-family:Arial,sans-serif;margin:0;background:#F3F6F4;color:#14231C}main{max-width:520px;margin:0 auto;padding:20px}
.tag{font-weight:700;color:#5F6F66}h1{font-size:30px;margin:4px 0}.big{font-size:44px;font-weight:900;color:#B3261E}
h2{font-size:19px;margin:22px 0 8px}.st{background:#fff;border:2px solid #F6C744;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:16px}
button{font:inherit;cursor:pointer}.ok{width:100%;min-height:64px;border:0;border-radius:16px;background:#2e7d32;color:#fff;font-size:20px;font-weight:800;margin-top:14px}
.days{display:grid;grid-template-columns:1fr 1fr;gap:8px}.day{min-height:60px;border:2px solid #123B2C;background:#fff;border-radius:14px;font-size:16px;padding:6px;color:#14231C}
.day small{display:block;color:#888;font-size:12px}.day:disabled{opacity:.4}.note{font-size:13px;color:#5F6F66}
#msg{margin-top:16px;font-size:20px;font-weight:800}.wait{font-size:18px;color:#5F6F66;margin-top:30px}
.conf{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.conf div{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;font-size:18px;font-weight:700}
.conf button{width:100%;min-height:54px;border-radius:12px;font-size:18px;font-weight:800;margin-top:10px;border:0}
.yes{background:#2e7d32;color:#fff}.no{background:#eee;color:#333}
</style></head><body><main id="app"><div class="wait">⏳ Chargement…</div></main>
<script>
// v1.1 (22/11/2026) : la base Centrale est fermée au public → l'adresse du script SAPINS est écrite ici (elle était lue dans la base,
// qui pouvait être modifiée par n'importe qui). Les boutons restent protégés par le jeton signé du lien (t).
var SAPINS_URL = "https://script.google.com/macros/s/AKfycbz8R8f6PppPxt4bxbVIJtEjcXtC-P_yLXrcBW0-47wMZS_7v1HiEdWaf0w-Rq1yyL34/exec";
var q = new URLSearchParams(location.search), D = q.get("d") || "", T = q.get("t") || "", URL_ = "";
var app = document.getElementById("app");
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function err(m){ app.innerHTML = '<h2>⚠️ ' + esc(m) + '</h2><p class="note">Réessayez dans un instant ou appelez Probon.</p>'; }
function call(body){
  body.d = D; body.t = T;
  return fetch(URL_, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body), redirect:"follow" })
    .then(function(r){ return r.json(); });
}
function ask(txt){
  return new Promise(function(res){
    var o = document.createElement("div"); o.className = "conf";
    o.innerHTML = '<div>' + esc(txt) + '<button class="yes">✅ Oui</button><button class="no">Annuler</button></div>';
    document.body.appendChild(o);
    o.querySelector(".yes").onclick = function(){ o.remove(); res(true); };
    o.querySelector(".no").onclick = function(){ o.remove(); res(false); };
  });
}
function lock(on){ document.querySelectorAll("button").forEach(function(b){ if (on) { b.dataset.was = b.disabled ? "1" : ""; b.disabled = true; } else b.disabled = !!b.dataset.was; }); }
function done(r){
  var m = document.getElementById("msg");
  if (r && r.ok){ m.innerHTML = esc(r.msg); document.querySelectorAll("button").forEach(function(b){ b.disabled = true; }); }
  else { m.innerHTML = "⚠️ " + esc((r && r.error) || "erreur"); lock(false); }
}
function act(body){ lock(true); document.getElementById("msg").innerHTML = "⏳ …"; call(body).then(done).catch(function(){ done({ ok:false, error:"Pas de connexion, réessayez." }); }); }
function conf(){ act({ action:"rungis-confirm" }); }
function mv(x, label){ ask("Récupérer le " + label + " au lieu d'aujourd'hui ?").then(function(ok){ if (ok) act({ action:"rungis-move", to:x }); }); }
function render(r){
  if (!r || !r.ok) return err((r && r.error) || "Lien invalide.");
  var h = '<div class="tag">' + (r.test ? '🧪 TEST — ne pas récupérer' : 'Sapins chez Cruard') + '</div><h1>' + esc(r.dayFr) + '</h1><div class="big">' + r.tot + ' sapins</div>'
    + (r.etat ? '<div class="st">' + esc(r.etat) + '</div>' : '');
  if (r.can){
    h += '<button class="ok" onclick="conf()">✅ Oui, on récupère aujourd\'hui</button><h2>📅 Pas possible ? On récupère le…</h2><div class="days">'
      + r.days.map(function(x){ return '<button class="day"' + (x.dis ? ' disabled' : '') + ' onclick="mv(\'' + esc(x.d) + '\',\'' + esc(x.label).replace(/'/g, "\\'") + '\')"><b>' + esc(x.label) + '</b>' + (x.dis ? '<small>déjà prévu</small>' : '') + '</button>'; }).join("")
      + '</div><p class="note">Les commandes des magasins suivent. Le nouveau mail arrivera ce jour-là à 2 h. Magasins et Probon sont prévenus.</p>';
  }
  app.innerHTML = h + '<div id="msg"></div>';
}
if (!/^\d{4}-\d{2}-\d{2}$/.test(D) || !T) err("Lien invalide.");
else { URL_ = SAPINS_URL; call({ action:"rungis-info" }).then(render).catch(function(){ err("Impossible de joindre le serveur."); }); }
</script></body></html>
