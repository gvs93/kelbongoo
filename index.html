    // ============================================================
    // CONSIGNE FORM
    // ============================================================
    function ConsigneForm({ orders, consumersByEmail, session, currentSite, onClose, editing }) {
      const showToast = React.useContext(ToastContext);
      // Si editing → on garde l'orderId existant. Sinon on commence avec un selectedKey vide.
      // selectedKey = soit orderId (si client a commandé aujourd'hui) soit email (si pas de commande)
      const [selectedKey, setSelectedKey] = React.useState(editing?.orderId || editing?.clientEmail || '');
      const [selectedName, setSelectedName] = React.useState(editing?.clientName || '');
      const [selectedEmail, setSelectedEmail] = React.useState(editing?.clientEmail || '');
      const [nbPots, setNbPots] = React.useState(editing?.nbPots || '1');
      const [remark, setRemark] = React.useState(editing?.remark || '');
      const [busy, setBusy] = React.useState(false);

      // Si la sélection correspond à une commande du jour, on récupère l'orderId
      const selectedOrder = orders.find(o => o.orderId === selectedKey);

      const handleSubmit = async () => {
        if (!selectedKey || !selectedName) { showToast('Choisis un client'); return; }
        const n = parseInt(nbPots, 10);
        if (!n || n < 1) { showToast('Nombre de pots invalide'); return; }
        setBusy(true);
        try {
          const id = editing?.id || `cons_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
          // orderId : commande du jour si dispo, sinon email, sinon la clé manuelle (jamais vide)
          const safeOrderId = selectedOrder ? selectedOrder.orderId : (selectedEmail || selectedKey || id);
          const data = {
            orderId: safeOrderId,
            site: currentSite,
            clientName: selectedName,
            clientEmail: selectedEmail,
            hasOrderToday: !!selectedOrder,
            nbPots: n,
            remark,
            day: todayKey(),
            status: 'pending',
            createdBy: session.name,
            createdAt: editing?.createdAt || new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          };
          await storage.setDoc('consignes', id, data);
          showToast(editing ? '✓ Mise à jour' : '✓ Consigne enregistrée');
          onClose();
        } catch (err) {
          showToast('Erreur : ' + err.message);
        } finally { setBusy(false); }
      };

      const handlePickClient = (info) => {
        setSelectedKey(info.key);
        setSelectedName(info.name);
        setSelectedEmail(info.email || '');
      };

      return (
        <div className="modal-backdrop" onClick={(e) => { if (e.target.className === 'modal-backdrop') onClose(); }}>
          <div className="modal">
            <div className="modal-header">
              <h2>{editing ? 'Modifier consigne' : 'Dépôt de pots'}</h2>
              <button className="modal-close" onClick={onClose}>×</button>
            </div>
            <div className="field">
              <label>Client</label>
              <ConsigneClientPicker
                orders={orders}
                consumersByEmail={consumersByEmail}
                selectedKey={selectedKey}
                selectedName={selectedName}
                onPick={handlePickClient}
                onClear={() => { setSelectedKey(''); setSelectedName(''); setSelectedEmail(''); }}
              />
            </div>
            <div className="field">
              <label>Nombre de pots déposés</label>
              <input type="number" min="1" value={nbPots} onChange={e => setNbPots(e.target.value)} />
            </div>
            <div className="field">
              <label>Remarque (optionnel)</label>
              <textarea rows={2} value={remark} onChange={e => setRemark(e.target.value)} placeholder="Précisions…" />
            </div>
            <div className="row">
              <button className="btn-secondary" onClick={onClose}>Annuler</button>
              <button className="btn-primary" disabled={busy} onClick={handleSubmit}>
                {busy ? 'Enregistrement…' : 'Enregistrer'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Picker spécifique aux consignes : cherche d'abord dans les commandes du jour,
    // sinon dans tous les consumers Kelbongoo
    function ConsigneClientPicker({ orders, consumersByEmail, selectedKey, selectedName, onPick, onClear }) {
      const [search, setSearch] = React.useState('');

      const results = React.useMemo(() => {
        const s = normalizeText(search);
        if (!s) {
          // Pas de recherche → on liste les commandes du jour (limité)
          return orders.slice(0, 20).map(o => ({
            key: o.orderId,
            name: displayName(o),
            email: o.email || '',
            hasOrderToday: true,
          }));
        }
        // Recherche : on commence par les commandes du jour matchant
        const fromOrders = orders
          .filter(o => normalizeText(displayName(o)).includes(s))
          .map(o => ({
            key: o.orderId,
            name: displayName(o),
            email: o.email || '',
            hasOrderToday: true,
          }));
        // Puis on cherche dans tous les consumers
        const orderEmails = new Set(orders.map(o => o.email));
        const fromConsumers = [];
        const cs = consumersByEmail || {};
        for (const email in cs) {
          if (fromConsumers.length >= 30) break;
          if (orderEmails.has(email)) continue; // déjà dans fromOrders
          const c = cs[email];
          const fullName = `${c.last_name || ''} ${c.first_name || ''}`.trim() || c.name || '';
          if (normalizeText(fullName).includes(s)) {
            fromConsumers.push({
              key: email,
              name: fullName,
              email,
              hasOrderToday: false,
            });
          }
        }
        return [...fromOrders, ...fromConsumers].slice(0, 50);
      }, [orders, consumersByEmail, search]);

      if (selectedKey && selectedName) {
        return (
          <div className="alert-success" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>✓ <strong>{selectedName}</strong></span>
            <button className="btn-ghost" style={{padding:'2px 8px', fontSize:11}} onClick={onClear}>Changer</button>
          </div>
        );
      }

      return (
        <>
          <div className="search-box">
            <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Chercher un client (commande du jour ou autre)…" />
          </div>
          <div style={{fontSize:11,color:'var(--ink-soft)',padding:'4px 6px'}}>
            {!search ? "Commandes du jour. Tape un nom pour chercher dans tous les clients." : `${results.length} résultat${results.length>1?'s':''}`}
          </div>
          <div className="product-list">
            {results.length === 0 ? (
              <div style={{padding: 14, textAlign: 'center', color: 'var(--ink-mute)', fontSize: 13}}>
                Aucun client trouvé dans la liste
              </div>
            ) : results.map(r => (
              <div key={r.key} className="product-item" onClick={() => onPick(r)}>
                <span>{r.name}</span>
                {!r.hasOrderToday && <span className="badge badge-info" style={{marginLeft:8,fontSize:10}}>pas de commande</span>}
              </div>
            ))}
          </div>
          {/* Saisie manuelle si le client n'est pas trouvé */}
          {search.trim().length >= 2 && (
            <div style={{marginTop:8,padding:'8px',background:'var(--accent-soft)',borderRadius:8}}>
              <div style={{fontSize:11,color:'var(--ink-soft)',marginBottom:6}}>Client introuvable ? Utilise ce nom tel quel :</div>
              <button className="btn-secondary btn-block" style={{fontSize:13}} onClick={() => onPick({ key: `MANUAL:${search.trim()}`, name: search.trim().toUpperCase(), email: '' })}>
                + Utiliser « {search.trim()} »
              </button>
            </div>
          )}
        </>
      );
    }

    // ============================================================
    // PAGE CLIENTS (jour J) — distrib + master
    // ============================================================
    function ClientsPage({ session, currentSite, orders, isClosed, dispatch, lastminute }) {
      const [statuses, setStatuses] = React.useState([]);
      const [filter, setFilter] = React.useState('not_passed');
      const [search, setSearch] = React.useState('');
      const [selectedClient, setSelectedClient] = React.useState(null);

      // Index dispatch dernière minute pour CE site : { [casier]: [{produit, qty}] }
      const lmByCasier = React.useMemo(() => {
        const idx = {};
        for (const l of (lastminute || [])) {
          const arr = (l.allocBySite && l.allocBySite[currentSite]) || [];
          for (const c of arr) {
            if (!idx[c.casier]) idx[c.casier] = [];
            idx[c.casier].push({ produit: l.produit, producteur: l.producteur, qty: c.qty });
          }
        }
        return idx;
      }, [lastminute, currentSite]);

      React.useEffect(() => {
        const unsub = storage.subscribe(`day_${todayKey()}_statuses`, setStatuses);
        return unsub;
      }, []);

      const statusMap = React.useMemo(() => {
        const m = {};
        for (const s of statuses) m[s.orderId] = s;
        return m;
      }, [statuses]);

      const visible = orders.filter(o => o.site === currentSite);

      const togglePassed = async (order) => {
        if (isClosed) return;
        const cur = statusMap[order.orderId];
        const newPassed = !(cur?.passed);
        await storage.setDoc(`day_${todayKey()}_statuses`, order.orderId, {
          orderId: order.orderId, site: currentSite,
          passed: newPassed,
          consumer_name: displayName(order),
          email: order.email,
          telephone: order.telephone || '',
          hasPhone: order.hasPhone,
          updatedBy: session.name,
          updatedAt: new Date().toISOString(),
        });
      };

      const filtered = visible.filter(o => {
        const passed = !!statusMap[o.orderId]?.passed;
        if (filter === 'passed' && !passed) return false;
        if (filter === 'not_passed' && passed) return false;
        if (search) {
          const s = normalizeText(search);
          if (!normalizeText(displayName(o)).includes(s)) return false;
        }
        return true;
      }).sort((a, b) => displayName(a).localeCompare(displayName(b)));

      const stats = {
        total: visible.length,
        passed: visible.filter(o => statusMap[o.orderId]?.passed).length,
        notPassed: visible.filter(o => !statusMap[o.orderId]?.passed).length,
      };

      // Si journée clôturée et distrib (non master), on cache les noms
      const hideNames = isClosed && !session.isMaster;

      return (
        <div className="stack">
          <h1>Clients · {currentSite}</h1>

          {isClosed && (
            <div className="alert-info">
              🔒 Journée clôturée — modifications désactivées
            </div>
          )}

          {orders.length === 0 && !isClosed && (
            <div className="alert-warning">
              ⚠️ Aucune commande chargée. Va dans <strong>Admin</strong> pour uploader le CSV du jour.
            </div>
          )}

          {!dispatch && orders.length > 0 && (
            <div className="alert-info">
              📦 Pas de dispatch chargé pour {currentSite}. Charge le Master + Dispatch frais/sec dans <strong>Admin</strong> pour voir le détail par casier.
            </div>
          )}
          {dispatch && (
            <div className="alert-success">
              📦 Dispatch chargé{dispatch.meta?.parts?.length ? ` (${dispatch.meta.parts.join(' · ')})` : ''}{dispatch.meta?.uploadedBy ? ` · par ${dispatch.meta.uploadedBy}` : ''} — clique un client pour voir ses casiers.
            </div>
          )}

          <div className="stat-grid">
            <div className="stat"><div className="stat-value">{stats.total}</div><div className="stat-label">Total</div></div>
            <div className="stat"><div className="stat-value" style={{color:'var(--accent)'}}>{stats.passed}</div><div className="stat-label">Passés</div></div>
            <div className="stat"><div className="stat-value" style={{color:'var(--warn)'}}>{stats.notPassed}</div><div className="stat-label">Restants</div></div>
          </div>

          {hideNames ? (
            <div className="empty-state">
              <div className="icon">🔒</div>
              <p>Liste des clients masquée après la clôture.<br/>Consulter le suivi si besoin.</p>
            </div>
          ) : (
            <>
              <div className="search-box">
                <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Rechercher…" />
              </div>
              <div className="filter-row">
                <div className={`chip ${filter==='not_passed'?'selected':''}`} onClick={()=>setFilter('not_passed')}>Non passés ({stats.notPassed})</div>
                <div className={`chip ${filter==='passed'?'selected':''}`} onClick={()=>setFilter('passed')}>Passés ({stats.passed})</div>
                <div className={`chip ${filter==='all'?'selected':''}`} onClick={()=>setFilter('all')}>Tous</div>
              </div>

              {filtered.length === 0 ? (
                <div className="empty-state">
                  <div className="icon">{stats.notPassed === 0 && stats.total > 0 ? '🎉' : '📭'}</div>
                  <p>{stats.notPassed === 0 && stats.total > 0 ? 'Tous passés !' : 'Aucun client.'}</p>
                </div>
              ) : (
                <div className="list">
                  {filtered.map(o => {
                    const passed = !!statusMap[o.orderId]?.passed;
                    const cd = dispatch ? buildClientDispatch(o, dispatch.master, dispatch.frais, dispatch.sec) : null;
                    // Casiers (frais + sec)
                    const casiersFrais = cd ? cd.frais.map(f => f.casier) : [];
                    const casiersSec = cd ? cd.sec.map(s => s.casier) : [];
                    // Pain = produits des casiers sec
                    const pains = cd ? cd.sec.flatMap(s => s.produits) : [];
                    // ND à remettre à la main : liste commune du site (dispatch.nd)
                    // Dispatch dernière minute pour les casiers (frais) de ce client
                    const lmItems = cd
                      ? [...casiersFrais, ...casiersSec].flatMap(cas => (lmByCasier[cas] || []))
                      : [];
                    const allCasiers = [...casiersFrais.map(c=>({c,t:'F'})), ...casiersSec.map(c=>({c,t:'S'}))];
                    return (
                      <div key={o.orderId} className={`list-item order-row ${passed ? 'passed' : ''}`}>
                        <div className="list-item-main" style={cd ? {cursor:'pointer'} : {}} onClick={() => cd && setSelectedClient(o)}>
                          <div className="list-item-name">
                            <span className={`indicator-dot ${passed ? 'passed' : 'not-passed'}`}></span>
                            {displayName(o)}
                            {allCasiers.length > 0 && (
                              <span style={{marginLeft:8,display:'inline-flex',gap:4,flexWrap:'wrap'}}>
                                {allCasiers.map((x,i) => (
                                  <span key={i} className="badge" style={{background:x.t==='S'?'var(--warn-soft)':'var(--accent-soft)',color:x.t==='S'?'var(--warn)':'var(--accent-dark)'}}>
                                    {x.t==='S'?'🍞':'🧊'} {x.c}
                                  </span>
                                ))}
                              </span>
                            )}
                            {dispatch && !cd && (
                              <span className="badge" style={{marginLeft:8,background:'var(--bg-muted)',color:'var(--ink-mute)'}}>hors master</span>
                            )}
                          </div>
                          {/* Résumé : pain + dispatch dernière minute */}
                          {cd && (pains.length > 0 || lmItems.length > 0) && (
                            <div style={{marginTop:4,display:'flex',flexDirection:'column',gap:2,fontSize:12}}>
                              {pains.length > 0 && (
                                <div style={{color:'var(--warn)'}}>🍞 {pains.map(p => p.produit + (p.qty>1?` ×${p.qty}`:'')).join(', ')}</div>
                              )}
                              {lmItems.length > 0 && (
                                <div style={{color:'var(--info)',fontWeight:600}}>
                                  ➕ Dispatch dernière minute : {lmItems.map(p => p.produit + (p.qty>1?` ×${p.qty}`:'')).join(', ')}
                                </div>
                              )}
                            </div>
                          )}
                          <div className="list-item-sub">
                            {o.hasPhone
                              ? <a href={`tel:${o.telephone}`} onClick={e=>e.stopPropagation()} style={{color:'var(--accent-dark)',fontWeight:600}}>📞 {o.telephone}</a>
                              : <span style={{color:'var(--warn)'}}>✉️ Email</span>}
                            {session.isMaster && o.email && <span style={{color:'var(--ink-mute)'}}>· {o.email}</span>}
                            {cd && <span style={{color:'var(--info)',marginLeft:6}}>· détail ›</span>}
                          </div>
                        </div>
                        <button className={passed ? 'btn-secondary' : 'btn-primary'} onClick={() => togglePassed(o)} disabled={isClosed} style={{padding:'8px 12px',fontSize:13,minWidth:90}}>
                          {passed ? '↩ Annuler' : '✓ Passé'}
                        </button>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}

          {selectedClient && dispatch && (
            <DispatchModal
              order={selectedClient}
              clientDispatch={buildClientDispatch(selectedClient, dispatch.master, dispatch.frais, dispatch.sec)}
              nd={dispatch.nd}
              lmByCasier={lmByCasier}
              onClose={() => setSelectedClient(null)}
            />
          )}
        </div>
      );
    }

    // ============================================================
    // MODAL DISPATCH CLIENT — casiers frais/sec + produits + ND
    // ============================================================
    function DispatchModal({ order, clientDispatch, nd, lmByCasier, onClose }) {
      const cd = clientDispatch;
      const renderCasierBlock = (entry, type) => {
        const color = type === 'frais' ? 'var(--accent)' : 'var(--warn)';
        const totalQty = entry.produits.reduce((s, p) => s + (p.qty || 1), 0);
        const lm = (lmByCasier && lmByCasier[entry.casier]) || [];
        return (
          <div key={type + entry.casier} className="card-flat" style={{padding:'12px 14px', marginBottom:10}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <span style={{fontWeight:700,fontSize:15,color}}>
                Casier {type} n°{entry.casier}
              </span>
              <span className="badge badge-info">{entry.produits.length} produit{entry.produits.length>1?'s':''}{totalQty>entry.produits.length?` · ${totalQty} art.`:''}</span>
            </div>
            {entry.produits.length === 0 ? (
              <div style={{color:'var(--ink-mute)',fontSize:13,fontStyle:'italic'}}>Aucun produit dispatché dans ce casier aujourd'hui.</div>
            ) : (
              <div className="stack" style={{gap:6}}>
                {entry.produits.map((p, i) => (
                  <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:10,fontSize:14,borderBottom:'1px solid var(--line)',paddingBottom:5}}>
                    <span>
                      <strong>{p.produit}</strong>
                      {p.producteur && <span style={{color:'var(--ink-mute)',fontSize:12}}> · {p.producteur}</span>}
                    </span>
                    {p.qty > 1 && <span className="badge badge-anom" style={{whiteSpace:'nowrap'}}>×{p.qty}</span>}
                  </div>
                ))}
              </div>
            )}
            {lm.length > 0 && (
              <div style={{marginTop:8,padding:'8px 10px',background:'var(--info-soft)',borderRadius:'var(--radius-sm)'}}>
                <div style={{fontSize:12,fontWeight:700,color:'var(--info)',marginBottom:4}}>➕ Dispatch dernière minute</div>
                {lm.map((p, i) => (
                  <div key={i} style={{fontSize:13,display:'flex',justifyContent:'space-between'}}>
                    <span>{p.produit}</span>{p.qty>1 && <span className="badge badge-info">×{p.qty}</span>}
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      return (
        <div className="modal-backdrop" onClick={(e) => { if (e.target.className === 'modal-backdrop') onClose(); }}>
          <div className="modal" style={{maxWidth:560}}>
            <div className="modal-header">
              <div>
                <strong style={{fontSize:17}}>📦 {displayName(order)}</strong>
                {cd?.telephone && <div style={{fontSize:13,color:'var(--ink-mute)'}}>📞 {cd.telephone}</div>}
              </div>
              <button className="modal-close" onClick={onClose}>×</button>
            </div>
            <div className="stack" style={{gap:14}}>
              {!cd ? (
                <div className="alert-warning">Ce client n'est pas dans le Master du jour.</div>
              ) : (
                <>
                  {/* FRAIS */}
                  <div>
                    <h3 style={{margin:'0 0 8px',fontSize:14,color:'var(--accent)'}}>🧊 Frais — {cd.frais.length} casier{cd.frais.length>1?'s':''}</h3>
                    {cd.frais.length === 0
                      ? <div style={{color:'var(--ink-mute)',fontSize:13}}>Aucun casier frais.</div>
                      : cd.frais.map(e => renderCasierBlock(e, 'frais'))}
                  </div>
                  {/* SEC */}
                  <div>
                    <h3 style={{margin:'0 0 8px',fontSize:14,color:'var(--warn)'}}>🍞 Sec — {cd.sec.length} casier{cd.sec.length>1?'s':''}</h3>
                    {cd.sec.length === 0
                      ? <div style={{color:'var(--ink-mute)',fontSize:13}}>Aucun casier sec.</div>
                      : cd.sec.map(e => renderCasierBlock(e, 'sec'))}
                  </div>
                  {/* ND — produits à remettre à la main (commun au site) */}
                  {nd && nd.length > 0 && (
                    <div>
                      <h3 style={{margin:'0 0 8px',fontSize:14,color:'var(--ink-soft)'}}>✋ Non-dispatch (à remettre à la main)</h3>
                      <div className="alert-info" style={{fontSize:12}}>Liste commune au site — vérifier la commande du client avant de remettre.</div>
                      <div className="stack" style={{gap:4,marginTop:8}}>
                        {nd.map((p, i) => (
                          <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:13,borderBottom:'1px solid var(--line)',paddingBottom:4}}>
                            <span>{p.produit}</span>
                            {p.total ? <span className="badge badge-info">total {p.total}</span> : null}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </>
              )}
            </div>
          </div>
        </div>
      );
    }
    function QualityPage({ session, currentSite, orders, products, isClosed, consumersByEmail }) {
      const [anomalies, setAnomalies] = React.useState([]);
      const [showForm, setShowForm] = React.useState(false);
      const [editing, setEditing] = React.useState(null);
      const showToast = React.useContext(ToastContext);

      React.useEffect(() => {
        const unsub = storage.subscribe(`day_${todayKey()}_anomalies`, setAnomalies);
        return unsub;
      }, []);

      const visible = anomalies.filter(a => a.site === currentSite);

    // ============================================================

    function FollowUpPage({ session, currentSite, consumersByEmail }) {

        // Approche : on s'abonne à followups + on lit les collections day_*_anomalies

        f.site === currentSite && f.status !== 'returned' && f.status !== 'picked_up'

    // ----- Sous-page Non-récup (ancien contenu de FollowUpPage) -----
    function NonRecupSubPage({ session, currentSite, consumersByEmail }) {
      const showToast = React.useContext(ToastContext);
      const [followUps, setFollowUps] = React.useState([]);
      const [filter, setFilter] = React.useState('pending');

      React.useEffect(() => {
        const unsub = storage.subscribe('followups', setFollowUps);
        return unsub;
      }, []);

      const visible = followUps.filter(f => {
        if (f.site !== currentSite) return false;
        if (filter === 'pending') return !['resolved'].includes(f.status);
        if (filter === 'resolved') return ['resolved'].includes(f.status);
        return true;
      });

      const setStatus = async (f, newStatus) => {
        await storage.setDoc('followups', f.orderId, {
          ...f, status: newStatus,
          updatedBy: session.name, updatedAt: new Date().toISOString(),
        });
        showToast(`Statut: ${newStatus}`);
      };

      const removeFromFollowUp = async (f) => {
        if (!confirm(`Retirer ${f.consumer_name} du suivi ?`)) return;
        await storage.deleteDoc('followups', f.orderId);
        showToast('Retiré');
      };

      const enriched = visible.map(f => {
        if (f.phone || f.email) return f;
        const cached = consumersByEmail && consumersByEmail[f.email];
        return {
          ...f,
          phone: cached?.telephone || '',
          hasPhone: !!(cached?.telephone && cached.telephone.length >= 9),
        };
      });

      // Grouper par date
      const byDate = {};
      for (const f of enriched) {
        const date = f.distribDate || f.day || todayKey();
        if (!byDate[date]) byDate[date] = [];
        byDate[date].push(f);
      }
      const sortedDates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
      const totalPending = enriched.length;
      const alertCount = enriched.filter(f => daysSince(f.distribDate || f.day) >= ALERT_DAYS_NON_RECUP).length;

      return (
        <div className="stack">
          <h1>Non-récupérés · {currentSite}</h1>
          <p style={{color:'var(--ink-soft)',fontSize:13,marginTop:-8}}>
            Distrib : appellent les clients avec téléphone. Master : email aux autres.
          </p>

          {alertCount > 0 && (
            <div className="alert-red">
              🔴 {alertCount} client{alertCount > 1 ? 's' : ''} non récupéré{alertCount > 1 ? 's' : ''} depuis +{ALERT_DAYS_NON_RECUP}j — retour PDP entrepôt
            </div>
          )}

          <div className="stat-grid">
            <div className="stat"><div className="stat-value">{totalPending}</div><div className="stat-label">À traiter</div></div>
            <div className="stat"><div className="stat-value">{sortedDates.length}</div><div className="stat-label">Distrib</div></div>
            <div className="stat"><div className="stat-value" style={{color:'var(--danger)'}}>{alertCount}</div><div className="stat-label">Alerte 7j+</div></div>
          </div>

          <div className="filter-row">
            <div className={`chip ${filter==='pending'?'selected':''}`} onClick={()=>setFilter('pending')}>À traiter</div>
            <div className={`chip ${filter==='resolved'?'selected':''}`} onClick={()=>setFilter('resolved')}>Résolus</div>
            <div className={`chip ${filter==='all'?'selected':''}`} onClick={()=>setFilter('all')}>Tous</div>
          </div>

          {sortedDates.length === 0 ? (
            <div className="empty-state"><div className="icon">✓</div><p>Aucun client.</p></div>
          ) : (
            sortedDates.map(date => {
              const items = byDate[date];
              const days = daysSince(date);
              const isAlert = days >= ALERT_DAYS_NON_RECUP;
              return (
                <details key={date} className={`distrib-section ${isAlert ? 'has-alert' : ''}`} open={isAlert || date === todayKey()}>
                  <summary>
                    <span>
                      {isAlert && '🔴 '}Distrib du {formatDateShort(date)}
                      <span style={{fontWeight:'normal',marginLeft:6,fontSize:12,opacity:0.8}}>
                        ({items.length} client{items.length > 1 ? 's' : ''}, il y a {days}j)
                      </span>
                    </span>
                    <span style={{fontSize:11}}>▼</span>
                  </summary>
                  <div>
                    {isAlert && <div className="retour-pdp">⚠️ Retour PDP entrepôt à organiser</div>}
                    {items.sort((a,b) => (a.consumer_name||'').localeCompare(b.consumer_name||'')).map(f => (
                      <div key={f.orderId} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                          <div className="list-item-main">
                            <div className="list-item-name">{f.consumer_name}</div>
                            <div className="list-item-sub">
                              {f.hasPhone
                                ? <a href={`tel:${f.phone}`} style={{color:'var(--accent-dark)',fontWeight:600}}>📞 {f.phone}</a>
                                : <span style={{color:'var(--warn)'}}>✉️ Email</span>}
                              {session.isMaster && f.email && <span style={{color:'var(--ink-mute)'}}>· {f.email}</span>}
                            </div>
                          </div>
                          {f.status && f.status !== 'pending' && <span className="badge badge-info">{f.status}</span>}
                        </div>
                        <div style={{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}}>
                          {f.hasPhone ? (
                            <>
                              <button className="btn-secondary" style={{padding:'6px 10px',fontSize:12}} onClick={() => setStatus(f, 'called')}>Contacté</button>
                              <button className="btn-secondary" style={{padding:'6px 10px',fontSize:12}} onClick={() => setStatus(f, 'no_answer')}>No answer</button>
                              <button className="btn-secondary" style={{padding:'6px 10px',fontSize:12}} onClick={() => setStatus(f, 'relance')}>Relancé</button>
                            </>
                          ) : session.isMaster && (
                            <button className="btn-secondary" style={{padding:'6px 10px',fontSize:12}} onClick={() => setStatus(f, 'emailed')}>Email envoyé</button>
                          )}
                          <button className="btn-primary" style={{padding:'6px 10px',fontSize:12}} onClick={() => setStatus(f, 'resolved')}>✓ Résolu</button>

                            <button className="btn-ghost" style={{padding:'6px 10px',fontSize:12}} onClick={() => removeFromFollowUp(f)}>🗑️</button>
                          )}

                      </div>
                    ))}

              );
            })

          {session.isMaster && (() => {
            const emailOnly = enriched.filter(f => !f.hasPhone && f.email && f.status !== 'resolved');
            if (emailOnly.length === 0) return null;
            return (
              <div className="card" style={{display:'flex',flexDirection:'column',gap:8}}>
                <div style={{fontSize:13,fontWeight:600}}>Relancer les {emailOnly.length} client(s) à contacter par email</div>
                <FreshdeskRelanceButton clients={emailOnly} onDone={() => {}} />
                <button className="btn-secondary" onClick={() => {
                  const emails = emailOnly.map(f => f.email).join(',');
                  window.location.href = `mailto:?bcc=${emails}&subject=Votre panier Kelbongoo non récupéré&body=Bonjour,%0A%0AVotre panier n'a pas été récupéré. Merci de nous recontacter.%0A%0AKelbongoo`;
                }}>
                  ✉️ Ou ouvrir mon client mail (sans Freshdesk)
                </button>
              </div>
            );
          })()}
        </div>
      );
    }

    // Bouton qui envoie les relances via le proxy Freshdesk (crée 1 ticket + mail par client)
    function FreshdeskRelanceButton({ clients, onDone }) {
      const showToast = React.useContext(ToastContext);
      const [busy, setBusy] = React.useState(false);
      const [result, setResult] = React.useState(null);

      const handleSend = async () => {
        if (!FRESHDESK_PROXY_URL || FRESHDESK_PROXY_URL.includes('TON_')) {
          showToast('Proxy Freshdesk non configuré');
          return;
        }
        if (!confirm(`Créer ${clients.length} ticket(s) Freshdesk et envoyer les emails de relance ?`)) return;
        setBusy(true);
        setResult(null);
        try {
          const payload = {
            secret: FRESHDESK_SECRET,
            clients: clients.map(c => ({
              email: c.email,
              name: c.consumer_name || c.clientName || '',
              subject: 'Votre commande Kelbongoo à récupérer',
              body: `Bonjour ${c.consumer_name || ''},\n\nVotre commande Kelbongoo n'a pas encore été récupérée sur le point ${c.site}. Merci de nous indiquer quand vous pourrez venir la chercher, ou de nous recontacter.\n\nÀ bientôt,\nL'équipe Kelbongoo`,
            })),
          };
          // Apps Script Web App nécessite un POST sans en-tête custom (sinon préflight CORS)
          const res = await fetch(FRESHDESK_PROXY_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (data.ok) {
            setResult(data);
            showToast(`✓ ${data.success} ticket(s) créé(s)${data.failed ? `, ${data.failed} échec(s)` : ''}`);
            onDone && onDone();
          } else {
            showToast('Erreur : ' + (data.error || 'inconnue'));
          }
        } catch (err) {
          showToast('Erreur réseau : ' + err.message);
        } finally { setBusy(false); }
      };

      return (
        <>
          <button className="btn-primary btn-lg" disabled={busy} onClick={handleSend}>
            {busy ? 'Envoi en cours…' : `🎫 Créer ${clients.length} ticket(s) Freshdesk + envoyer`}
          </button>
          {result && (
            <div style={{fontSize:12,color:'var(--ink-soft)',marginTop:4}}>
              {result.success} envoyé(s){result.failed ? `, ${result.failed} échec(s)` : ''}.
            </div>
          )}
        </>
      );
    }

    // ----- Sous-page Oublis casier -----
    function OublisSubPage({ session, currentSite, forgottens, consumersByEmail }) {
      const showToast = React.useContext(ToastContext);
      const [filter, setFilter] = React.useState('pending');

      // Enrichir avec le contact client (depuis le cache consumers si pas déjà présent)
      const enrich = (f) => {
        const cached = consumersByEmail && f.clientEmail ? consumersByEmail[f.clientEmail] : null;
        return {
          ...f,
          phone: f.clientPhone || cached?.telephone || '',
          email: f.clientEmail || '',
        };
      };

      // "traité" = sorti de la vue active, archivé dans l'historique
      const isActive = (f) => f.status !== 'done';
      const visible = forgottens.filter(f => {
        if (f.site !== currentSite) return false;
        if (filter === 'pending') return isActive(f);
        if (filter === 'history') return f.status === 'done';
        return true;
      }).map(enrich);

      const setStatus = async (f, patch) => {
        await storage.setDoc('forgotten_items', f.id, {
          ...f, ...patch,
          updatedBy: session.name, updatedAt: new Date().toISOString(),
        });
      };

      const markDone = async (f) => {
        await setStatus(f, { status: 'done' });
        showToast('✓ Traité — déplacé dans l\'historique');
      };

      const toggleAvoir = async (f) => {
        await setStatus(f, { avoirApplied: !f.avoirApplied });
        showToast(f.avoirApplied ? 'Avoir retiré' : '✓ Avoir marqué appliqué');
      };

      const removeForgotten = async (f) => {
        if (!confirm(`Supprimer définitivement cet oubli ?`)) return;
        await storage.deleteDoc('forgotten_items', f.id);
        showToast('Supprimé');
      };

      // Grouper par date
      const byDate = {};
      for (const f of visible) {
        const d = f.day || (f.createdAt ? f.createdAt.slice(0,10) : todayKey());
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(f);
      }
      const sortedDates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
      const allActive = forgottens.filter(f => f.site === currentSite && isActive(f)).map(enrich);
      const totalPending = allActive.length;
      const alertCount = allActive.filter(f => daysSince(f.day || f.createdAt) >= 3).length;

      return (
        <div className="stack">
          <h1>Oublis casier · {currentSite}</h1>
          <p style={{color:'var(--ink-soft)',fontSize:13,marginTop:-8}}>
            Articles oubliés par les clients dans leurs casiers. Au bout de 3j sans nouvelles → renvoyer à l'entrepôt.
          </p>

          {filter === 'pending' && alertCount > 0 && (
            <div className="alert-red">
              🔴 {alertCount} article{alertCount > 1 ? 's' : ''} oublié{alertCount > 1 ? 's' : ''} depuis +3j — à renvoyer entrepôt
            </div>
          )}

          <div className="stat-grid">
            <div className="stat"><div className="stat-value">{totalPending}</div><div className="stat-label">En cours</div></div>
            <div className="stat"><div className="stat-value" style={{color:'var(--danger)'}}>{alertCount}</div><div className="stat-label">Alerte 3j+</div></div>
          </div>

          <div className="filter-row">
            <div className={`chip ${filter==='pending'?'selected':''}`} onClick={()=>setFilter('pending')}>En cours</div>

          {sortedDates.length === 0 ? (

                      <span style={{fontWeight:'normal',marginLeft:6,fontSize:12,opacity:0.8}}>
                        ({items.length} article{items.length > 1 ? 's' : ''}, il y a {days}j)
                      </span>
                    </span>
                    <span style={{fontSize:11}}>▼</span>
                  </summary>
                  <div>
                    {isAlert && <div className="retour-pdp">⚠️ À renvoyer à l'entrepôt</div>}

                              {f.email && <span style={{marginLeft:8}}>✉️ {f.email}</span>}
                            </div>
                            {f.remark && <div style={{fontSize:12,fontStyle:'italic',color:'var(--ink-soft)',marginTop:4}}>« {f.remark} »</div>}
                          </div>

                        </div>

                        {/* Actions master */}
                        {session.isMaster && f.status !== 'done' && (
                          <div style={{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}}>
                            <button className={f.avoirApplied ? 'btn-primary' : 'btn-secondary'} style={{padding:'6px 10px',fontSize:12}} onClick={() => toggleAvoir(f)}>
                              {f.avoirApplied ? '💰 Avoir appliqué ✓' : '💰 Marquer avoir'}
                            </button>
                            {f.email && (
                              <FreshdeskOubliButton client={f} />
                            )}
                            <button className="btn-primary" style={{padding:'6px 10px',fontSize:12}} onClick={() => markDone(f)}>✓ Traité</button>
                            <button className="btn-ghost" style={{padding:'6px 10px',fontSize:12}} onClick={() => removeForgotten(f)}>🗑️</button>
                          </div>
                        )}

                        {/* Actions distrib (limité) */}
                        {!session.isMaster && f.status !== 'done' && (
                          <div style={{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}}>
                            <span style={{fontSize:12,color:'var(--ink-soft)'}}>En attente de traitement par le master.</span>
                          </div>
                        )}

                    ))}

                </details>
              );
            })
          )}
        </div>
      );

    // Bouton Freshdesk pour relancer un client sur un oubli casier
    function FreshdeskOubliButton({ client }) {
      const showToast = React.useContext(ToastContext);
      const [busy, setBusy] = React.useState(false);
      const [sent, setSent] = React.useState(false);

      const handleSend = async () => {
        if (!FRESHDESK_PROXY_URL || FRESHDESK_PROXY_URL.includes('TON_')) {
          showToast('Proxy Freshdesk non configuré');
          return;
        }
        setBusy(true);
        try {
          const payload = {
            secret: FRESHDESK_SECRET,
            clients: [{
              email: client.email,
              name: client.clientName || '',
              subject: 'Article oublié dans votre casier Kelbongoo',
              body: `Bonjour ${client.clientName || ''},\n\nVous avez oublié un article dans votre casier lors de la distribution sur le point ${client.site} :\n- ${client.productLabel || 'article'}\n\nMerci de venir le récupérer dans les prochains jours. Sans nouvelles de votre part sous 3 jours, l'article sera retourné à l'entrepôt.\n\nÀ bientôt,\nL'équipe Kelbongoo`,
            }],
          };
          const res = await fetch(FRESHDESK_PROXY_URL, { method: 'POST', body: JSON.stringify(payload) });
          const data = await res.json();
          if (data.ok && data.success > 0) {
            setSent(true);
            showToast('✓ Ticket Freshdesk créé + mail envoyé');
          } else {
            showToast('Erreur : ' + (data.error || (data.results && data.results[0]?.error) || 'inconnue'));
          }
        } catch (err) {
          showToast('Erreur réseau : ' + err.message);
        } finally { setBusy(false); }
      };

      return (
        <button className={sent ? 'btn-secondary' : 'btn-secondary'} style={{padding:'6px 10px',fontSize:12}} disabled={busy} onClick={handleSend}>
          {busy ? 'Envoi…' : sent ? '🎫 Relance envoyée ✓' : '🎫 Relancer (Freshdesk)'}
        </button>
      );
    }

    // ============================================================
    // PAGE CLÔTURE
    // ============================================================
    function ClosurePage({ session, currentSite, orders, consumersByEmail, isClosed, onReopen }) {
      const showToast = React.useContext(ToastContext);
      const [statuses, setStatuses] = React.useState([]);
      const [confirming, setConfirming] = React.useState(false);
      const [closing, setClosing] = React.useState(false);
      const [progress, setProgress] = React.useState({ done: 0, total: 0 });
      const [reopenPwd, setReopenPwd] = React.useState('');
      const [askReopen, setAskReopen] = React.useState(false);
      // Distributions passées non clôturées sur ce site (master seulement)
      const [pastUnclosed, setPastUnclosed] = React.useState([]);

      React.useEffect(() => {
        const unsub = storage.subscribe(`day_${todayKey()}_statuses`, setStatuses);
        return unsub;
      }, []);

      // Master : détecter les jours passés avec commandes mais sans clôture pour ce site
      React.useEffect(() => {
        if (!session.isMaster) return;
        // On regarde les 14 derniers jours
        const checkPast = async () => {
          const out = [];
          for (let i = 1; i <= 14; i++) {
            const day = addDays(todayKey(), -i);
            try {
              const ordersDay = await storage.getAll(`day_${day}_orders`);
              if (ordersDay.length === 0 || !ordersDay[0].orders) continue;
              const siteOrders = ordersDay[0].orders.filter(o => o.site === currentSite);
              if (siteOrders.length === 0) continue;
              // Y a-t-il une clôture pour ce site ce jour-là ?
              const closures = await storage.getAll(`day_${day}_closure`);
              const closed = closures.find(c => (c.site || c.id) === currentSite);
              if (!closed) {
                out.push({ day, orderCount: siteOrders.length });
              }
            } catch (e) { /* ignore */ }
          }
          setPastUnclosed(out);
        };
        checkPast();
      }, [session, currentSite]);

      const handleClosePastDay = async (day, orderCount) => {
        if (!confirm(`Clôturer la distribution du ${formatDateShort(day)} pour ${currentSite} ?\nLes clients non marqués passés iront dans le suivi non-récup.`)) return;
        try {
          const ordersDay = await storage.getAll(`day_${day}_orders`);
          const allOrdersOfDay = ordersDay[0]?.orders || [];
          const siteOrdersOfDay = allOrdersOfDay.filter(o => o.site === currentSite);
          const statusesDay = await storage.getAll(`day_${day}_statuses`);
          const statusMapDay = {};
          for (const s of statusesDay) statusMapDay[s.orderId] = s;
          const passedOfDay = siteOrdersOfDay.filter(o => statusMapDay[o.orderId]?.passed);
          const notPassedOfDay = siteOrdersOfDay.filter(o => !statusMapDay[o.orderId]?.passed);
          for (const o of notPassedOfDay) {
            const cached = consumersByEmail && consumersByEmail[o.email];
            await storage.setDoc('followups', o.orderId, {
              orderId: o.orderId, site: currentSite,
              consumer_name: displayName(o),
              clientName: displayName(o),
              email: o.email,
              phone: cached?.telephone || o.telephone || '',
              hasPhone: !!(cached?.telephone || o.telephone),
              day, distribDate: day,
              status: 'pending',
              createdBy: session.name,
              createdAt: new Date().toISOString(),
            });
          }
          await storage.setDoc(`day_${day}_closure`, currentSite, {
            site: currentSite, closedBy: session.name,
            closedAt: new Date().toISOString(),
            notPassedCount: notPassedOfDay.length, passedCount: passedOfDay.length,
            lateClosure: true,
          });
          setPastUnclosed(curr => curr.filter(p => p.day !== day));
          showToast(`✓ Distribution du ${formatDateShort(day)} clôturée`);
        } catch (e) {
          showToast('Erreur : ' + e.message);
        }
      };

      const statusMap = React.useMemo(() => {
        const m = {}; for (const s of statuses) m[s.orderId] = s; return m;
      }, [statuses]);

      const visible = orders.filter(o => o.site === currentSite);
      const notPassed = visible.filter(o => !statusMap[o.orderId]?.passed);
      const passed = visible.filter(o => statusMap[o.orderId]?.passed);

      const handleCloseDay = async () => {
        setClosing(true);
        setProgress({ done: 0, total: notPassed.length });
        try {
          for (let i = 0; i < notPassed.length; i++) {
            const o = notPassed[i];
            const cached = consumersByEmail && consumersByEmail[o.email];
            await storage.setDoc('followups', o.orderId, {
              orderId: o.orderId, site: currentSite,
              consumer_name: displayName(o),
              clientName: displayName(o),
              email: o.email,
              phone: cached?.telephone || o.telephone || '',
              hasPhone: !!(cached?.telephone || o.telephone),
              day: todayKey(),
              distribDate: todayKey(),
              status: 'pending',
              createdBy: session.name,
              createdAt: new Date().toISOString(),
            });
            setProgress({ done: i + 1, total: notPassed.length });
          }
          await storage.setDoc(`day_${todayKey()}_closure`, currentSite, {
            site: currentSite, closedBy: session.name,
            closedAt: new Date().toISOString(),
            notPassedCount: notPassed.length, passedCount: passed.length,
          });
          setConfirming(false);
          showToast(`✓ Journée clôturée pour ${currentSite}`);
        } catch (e) { showToast('Erreur : ' + e.message); }
        finally { setClosing(false); }
      };

      const handleReopen = async () => {
        if (reopenPwd !== MASTER_PASSWORD) { showToast('Mot de passe incorrect'); return; }
        await storage.deleteDoc(`day_${todayKey()}_closure`, currentSite);
        setAskReopen(false);
        setReopenPwd('');
        showToast('Journée ré-ouverte');
        onReopen && onReopen();
      };

      return (
        <div className="stack">
          <h1>Clôture · {currentSite}</h1>
          <p style={{color:'var(--ink-soft)',fontSize:13,marginTop:-8}}>
            Validation de fin de journée. Les non-passés iront dans le suivi.
          </p>

          {session.isMaster && pastUnclosed.length > 0 && (
            <div className="alert-red">
              <strong>⚠️ Distribution{pastUnclosed.length > 1 ? 's' : ''} précédente{pastUnclosed.length > 1 ? 's' : ''} non clôturée{pastUnclosed.length > 1 ? 's' : ''} sur {currentSite} :</strong>
              <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:6}}>
                {pastUnclosed.map(p => (
                  <div key={p.day} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,background:'rgba(255,255,255,0.5)',padding:'8px 10px',borderRadius:6}}>
                    <span style={{fontSize:13}}>
                      <strong>{formatDateShort(p.day)}</strong> · {p.orderCount} commande{p.orderCount > 1 ? 's' : ''}
                    </span>
                    <button className="btn-primary" style={{padding:'4px 10px',fontSize:12}} onClick={() => handleClosePastDay(p.day, p.orderCount)}>
                      Clôturer
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {isClosed ? (
            <>
              <div className="alert-info" style={{padding:14}}>
                🔒 <strong>Cette journée est déjà clôturée pour {currentSite}.</strong>
              </div>
              {session.isMaster && (
                !askReopen ? (
                  <button className="btn-secondary" onClick={() => setAskReopen(true)}>
                    🔓 Ré-ouvrir (master)
                  </button>
                ) : (
                  <div className="card">
                    <h3 style={{marginBottom:10}}>Confirmer ré-ouverture</h3>
                    <input type="password" value={reopenPwd} onChange={e => setReopenPwd(e.target.value)} placeholder="Mot de passe master" autoFocus />
                    <div className="row" style={{marginTop:10}}>
                      <button className="btn-secondary" onClick={() => { setAskReopen(false); setReopenPwd(''); }}>Annuler</button>
                      <button className="btn-warn" onClick={handleReopen}>Confirmer</button>
                    </div>
                  </div>
                )
              )}
            </>
          ) : (
            <>
              <div className="stat-grid">
                <div className="stat"><div className="stat-value">{visible.length}</div><div className="stat-label">Total</div></div>
                <div className="stat"><div className="stat-value" style={{color:'var(--accent)'}}>{passed.length}</div><div className="stat-label">Passés</div></div>
                <div className="stat"><div className="stat-value" style={{color:'var(--warn)'}}>{notPassed.length}</div><div className="stat-label">Non récup.</div></div>
              </div>

              {notPassed.length > 0 && (
                <div className="card">
                  <h3 style={{marginBottom:10}}>Clients non récupérés ({notPassed.length})</h3>
                  <div style={{maxHeight:200,overflowY:'auto'}}>
                    {notPassed.map(o => (
                      <div key={o.orderId} style={{padding:'6px 0',fontSize:13,borderBottom:'1px solid var(--line)'}}>
                        {displayName(o)} {o.hasPhone ? '📞' : '✉️'}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {!confirming ? (
                <button className="btn-warn btn-lg btn-block" onClick={() => setConfirming(true)} disabled={visible.length === 0}>
                  🔒 Clôturer la journée
                </button>
              ) : (
                <div className="card" style={{background:'var(--warn-soft)',border:'1px solid var(--warn)'}}>
                  <h3 style={{color:'var(--warn)',marginBottom:8}}>⚠️ Confirmation</h3>
                  <p style={{fontSize:13,marginBottom:12,color:'var(--ink-soft)'}}>
                    {notPassed.length} non-passés vont être ajoutés au suivi pour relance.
                    <br/><br/>
                    <em>N'oublie pas de marquer aussi sur distributions.kelbongoo.com.</em>
                  </p>
                  {closing && (
                    <div style={{margin:'12px 0',fontSize:12,color:'var(--ink-soft)'}}>
                      Traitement : {progress.done} / {progress.total}
                    </div>
                  )}
                  <div className="row">
                    <button className="btn-secondary" onClick={() => setConfirming(false)} disabled={closing}>Annuler</button>
                    <button className="btn-warn" onClick={handleCloseDay} disabled={closing}>
                      {closing ? 'Clôture…' : 'Oui, clôturer'}
                    </button>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    // ============================================================
    // TABLEAU MANQUANTS — vue compacte, filtrable, scannable
    // ============================================================
    function ManquantsTable({ manquants, lmByManquant, onReason, onDispatch, onDelete }) {
      const [filter, setFilter] = React.useState('all'); // all | noreason | reason | dispatched
      const [q, setQ] = React.useState('');

      const reasonLabel = (id) => (PREP_REASONS.find(r => r.id === id) || {}).label || '';

      const enriched = manquants.map(m => ({
        ...m,
        isLM: lmByManquant.has(m.id),
        hasReason: !!m.reason,
      }));

      const counts = {
        all: enriched.length,
        noreason: enriched.filter(m => !m.hasReason && !m.isLM).length,
        reason: enriched.filter(m => m.hasReason && !m.isLM).length,
        dispatched: enriched.filter(m => m.isLM).length,
      };

      let rows = enriched;
      if (filter === 'noreason') rows = rows.filter(m => !m.hasReason && !m.isLM);
      else if (filter === 'reason') rows = rows.filter(m => m.hasReason && !m.isLM);
      else if (filter === 'dispatched') rows = rows.filter(m => m.isLM);
      if (q.trim()) {
        const nq = q.toLowerCase();
        rows = rows.filter(m => (m.produit||'').toLowerCase().includes(nq) || (m.producteur||'').toLowerCase().includes(nq));
      }
      // Tri : sans raison d'abord (à traiter), puis avec raison, puis dispatchés ; alpha à l'intérieur
      rows = [...rows].sort((a, b) => {
        const rank = (m) => m.isLM ? 2 : (m.hasReason ? 1 : 0);
        const d = rank(a) - rank(b);
        if (d !== 0) return d;
        return (a.produit||'').localeCompare(b.produit||'');
      });

      const Chip = ({ id, label, n, color }) => (
        <button onClick={() => setFilter(id)}
          style={{
            border:'none', cursor:'pointer', fontSize:12, fontWeight:600,
            padding:'5px 10px', borderRadius:999,
            background: filter===id ? (color||'var(--accent)') : 'var(--bg-muted)',
            color: filter===id ? '#fff' : 'var(--ink-soft)',
          }}>
          {label} {n}
        </button>
      );

      return (
        <div className="stack" style={{gap:10}}>
          {/* Synthèse cliquable = filtres */}
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            <Chip id="all" label="Tous" n={counts.all} color="var(--ink-soft)" />
            <Chip id="noreason" label="⚠️ Sans raison" n={counts.noreason} color="var(--warn)" />
            <Chip id="reason" label="✓ Avec raison" n={counts.reason} color="var(--accent)" />
            <Chip id="dispatched" label="🚚 Dispatchés" n={counts.dispatched} color="var(--info)" />
          </div>

          {counts.all > 6 && (
            <input type="text" placeholder="🔎 Filtrer un produit…" value={q} onChange={e => setQ(e.target.value)} style={{fontSize:13}} />
          )}

          {/* Tableau compact */}
          <div style={{border:'1px solid var(--line)',borderRadius:'var(--radius-sm)',overflow:'hidden'}}>
            {rows.length === 0 ? (
              <div style={{padding:16,textAlign:'center',color:'var(--ink-mute)',fontSize:13}}>Aucun produit dans ce filtre.</div>
            ) : rows.map((m, i) => (
              <div key={m.id} style={{
                display:'flex', alignItems:'center', gap:8, padding:'8px 10px',
                borderTop: i ? '1px solid var(--line)' : 'none',
                background: m.isLM ? 'var(--info-soft)' : (!m.hasReason ? 'var(--warn-soft)' : 'transparent'),
              }}>
                {/* Produit + manque */}
                <div style={{flex:'2 1 140px',minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:13,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                    {m.isLM ? '🚚 ' : ''}{m.produit}
                  </div>
                  <div style={{fontSize:11,color:'var(--ink-mute)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                    {m.producteur} · <strong>−{m.manque}</strong>/{m.total}
                  </div>
                </div>
                {/* Raison (badge si renseignée, sinon select) */}
                <div style={{flex:'1 1 130px',minWidth:0}}>
                  {m.isLM ? (
                    <span className="badge badge-info" style={{fontSize:11}}>dispatché ↓</span>
                  ) : (
                    <select value={m.reason || ''} onChange={e => onReason(m, e.target.value)}
                      style={{fontSize:12,padding:'4px 6px',width:'100%',
                        borderColor: m.hasReason ? 'var(--line)' : 'var(--warn)'}}>
                      <option value="">— raison —</option>
                      {PREP_REASONS.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}
                    </select>
                  )}
                </div>
                {/* Actions */}
                <div style={{flex:'0 0 auto',display:'flex',gap:4}}>
                  {!m.isLM && (
                    <button className="btn-secondary" onClick={() => onDispatch(m)} title="Produit arrivé → dispatcher"
                      style={{fontSize:12,padding:'5px 8px',whiteSpace:'nowrap'}}>🚚</button>
                  )}
                  <button className="btn-ghost" onClick={() => onDelete(m)} style={{fontSize:13,padding:'5px 6px'}}>🗑️</button>
                </div>
              </div>
            ))}
          </div>

          {/* Champ "préciser" pour les raisons = Autre */}
          {rows.some(m => m.reason === 'autre' && !m.isLM) && (
            <div className="stack" style={{gap:4}}>
              {rows.filter(m => m.reason === 'autre' && !m.isLM).map(m => (
                <div key={m.id} style={{display:'flex',alignItems:'center',gap:6,fontSize:12}}>
                  <span style={{color:'var(--ink-mute)',whiteSpace:'nowrap',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis'}}>{m.produit} :</span>
                  <input type="text" placeholder="préciser la raison…" defaultValue={m.reasonNote||''}
                    onBlur={e => onReason(m, 'autre', e.target.value)} style={{flex:1,fontSize:12}} />
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // PAGE PRÉPA — DISPATCH (uploads PDF + manquants + dispatch dernière minute)
    // ============================================================
    function PrepDispatchPage({ session }) {
      const showToast = React.useContext(ToastContext);

      // --- Date de distribution choisie (obligatoire) ---
      const [day, setDay] = React.useState(null); // dayKey choisie, null = pas encore choisi
      const today = todayKey();
      const nextDay = nextDistribDate(today);
      const dayAfter = nextDay ? nextDistribDate(addDays(nextDay, 1)) : null;

      // Locaux disponibles pour la date choisie
      const sitesForDay = day ? sitesForDate(day) : [];

      // --- Données du jour choisi (chargées localement à cette page) ---
      const [dispatchData, setDispatchData] = React.useState({});
      const [manquants, setManquants] = React.useState([]);
      const [lastmin, setLastmin] = React.useState([]);

      React.useEffect(() => {
        if (!day) { setDispatchData({}); setManquants([]); setLastmin([]); return; }
        const u0 = storage.subscribe(`day_${day}_dispatch`, (arr) => {
          const map = {};
          for (const d of arr) {
            map[d.id] = {
              master: d.master ? safeJSON(d.master) : null,
              frais: d.frais ? safeJSON(d.frais) : null,
              sec: d.sec ? safeJSON(d.sec) : null,
              nd: d.nd ? safeJSON(d.nd) : null,
              meta: { uploadedBy: d.uploadedBy, uploadedAt: d.uploadedAt, parts: d.parts || [] },
            };
          }
          setDispatchData(map);
        });
        const u1 = storage.subscribe(`day_${day}_manquants`, setManquants);
        const u2 = storage.subscribe(`day_${day}_lastminute`, setLastmin);
        return () => { u0(); u1(); u2(); };
      }, [day]);

      // --- Uploads dispatch par site ---
      const [dispSite, setDispSite] = React.useState('');
      const [masterFile, setMasterFile] = React.useState(null);
      const [fraisFile, setFraisFile] = React.useState(null);
      const [secFile, setSecFile] = React.useState(null);
      const [ndFile, setNdFile] = React.useState(null);
      const [busy, setBusy] = React.useState(false);

      // Quand on choisit la date, pré-sélectionne un local valide
      React.useEffect(() => {
        if (day && sitesForDay.length && !sitesForDay.includes(dispSite)) {
          setDispSite(sitesForDay.includes(session.site) ? session.site : sitesForDay[0]);
        }
      }, [day]);

      // --- Manquants (global) ---
      const [manqFiles, setManqFiles] = React.useState([]); // plusieurs PDF d'un coup
      const [lmModal, setLmModal] = React.useState(null);    // manquant en cours de transformation
      const [showManual, setShowManual] = React.useState(false);
      const [manProduit, setManProduit] = React.useState('');
      const [manProducteur, setManProducteur] = React.useState('');
      const [manQty, setManQty] = React.useState('');

      const lmByManquant = React.useMemo(() => {
        return new Set(lastmin.map(l => l.manquantId));
      }, [lastmin]);

      const sitesLoaded = Object.keys(dispatchData || {});

      // ÉCRAN 1 : choix de la date (bloquant tant que pas choisi)
      if (!day) {
        return (
          <div className="stack">
            <h1>Dispatch · prépa</h1>
            <div className="card">
              <h3 style={{marginBottom:6}}>Pour quelle distribution travailles-tu ?</h3>
              <p style={{fontSize:13,color:'var(--ink-soft)',marginBottom:14}}>
                Choisis le jour de distribution pour lequel tu charges les documents. Tu pourras en changer ensuite.
              </p>
              <div className="stack" style={{gap:8}}>
                {isDistribDay(today) && (
                  <button className="btn-primary btn-block" onClick={() => setDay(today)}>
                    Aujourd'hui — {dayLabelShort(today)}
                  </button>
                )}
                {nextDay && nextDay !== today && (
                  <button className={isDistribDay(today) ? 'btn-secondary btn-block' : 'btn-primary btn-block'} onClick={() => setDay(nextDay)}>
                    Prochaine distrib — {dayLabelShort(nextDay)}
                  </button>
                )}
                {dayAfter && dayAfter !== nextDay && (
                  <button className="btn-secondary btn-block" onClick={() => setDay(dayAfter)}>
                    Suivante — {dayLabelShort(dayAfter)}
                  </button>
                )}
                <div style={{marginTop:6}}>
                  <label style={{fontSize:12,fontWeight:600,display:'block',marginBottom:4}}>Ou une autre date</label>
                  <input type="date" value={today} min={today}
                    onChange={(e) => {
                      const v = e.target.value;
                      if (!v) return;
                      if (!isDistribDay(v)) { showToast('Pas de distribution ce jour-là'); return; }
                      setDay(v);
                    }} style={{fontSize:14}} />
                </div>
              </div>
            </div>
          </div>
        );
      }

      const handleUploadDispatch = async () => {
        if (!dispSite) { showToast('Choisis un local'); return; }
        if (!masterFile && !fraisFile && !secFile && !ndFile) { showToast('Ajoute au moins un PDF'); return; }
        if (!window.pdfjsLib) { showToast('PDF.js non chargé, recharge la page'); return; }
        setBusy(true);
        try {
          const buf = (f) => f.arrayBuffer();
          const payload = { uploadedBy: session.name, uploadedAt: new Date().toISOString() };
          const parts = [];
          if (masterFile) { const m = await parseMasterPDF(await buf(masterFile)); payload.master = JSON.stringify(m); parts.push(`Master (${Object.keys(m).length})`); }
          if (fraisFile) { const d = await parseDispatchPDF(await buf(fraisFile)); payload.frais = JSON.stringify(d); parts.push(`Frais (${d.products.length})`); }
          if (secFile) { const d = await parseDispatchPDF(await buf(secFile)); payload.sec = JSON.stringify(d); parts.push(`Sec (${d.products.length})`); }
          if (ndFile) { const n = await parseNDPDF(await buf(ndFile)); payload.nd = JSON.stringify(n); parts.push(`ND (${n.length})`); }
          payload.parts = parts;
          await storage.setDoc(`day_${day}_dispatch`, dispSite, payload);
          showToast(`✓ Dispatch ${dispSite} : ${parts.join(' · ')}`);
          setMasterFile(null); setFraisFile(null); setSecFile(null); setNdFile(null);
        } catch (e) { showToast('Erreur PDF : ' + e.message); }
        finally { setBusy(false); }
      };

      const handleUploadManquants = async () => {
        if (!manqFiles.length) { showToast('Choisis le(s) PDF des manquants'); return; }
        if (!window.pdfjsLib) { showToast('PDF.js non chargé'); return; }
        setBusy(true);
        try {
          // Plusieurs PDF (plusieurs pages du site) chargés d'un coup, cumulés.
          let count = 0;
          for (const f of manqFiles) {
            const items = await parseManquantsPDF(await f.arrayBuffer());
            for (const it of items) {
              const id = dispatchNorm(it.producteur + '|' + it.produit) || `m_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
              await storage.setDoc(`day_${day}_manquants`, id, {
                produit: it.produit, producteur: it.producteur, cond: it.cond,
                fini: it.fini, total: it.total, manque: it.manque,
                reason: '', reasonNote: '',
                status: 'rupture', // rupture par défaut
                uploadedBy: session.name, uploadedAt: new Date().toISOString(),
              });
              count++;
            }
          }
          showToast(`✓ ${count} manquants → ruptures (${manqFiles.length} PDF)`);
          setManqFiles([]);
        } catch (e) { showToast('Erreur PDF : ' + e.message); }
        finally { setBusy(false); }
      };

      // Ajout d'un manquant à la main (produit non présent dans le PDF)
      const handleAddManual = async () => {
        if (!manProduit.trim()) { showToast('Indique le produit'); return; }
        const qty = parseInt(manQty, 10) || 0;
        setBusy(true);
        try {
          const id = dispatchNorm(manProducteur + '|' + manProduit) || `m_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
          await storage.setDoc(`day_${day}_manquants`, id, {
            produit: manProduit.trim(), producteur: manProducteur.trim(), cond: '',
            fini: 0, total: qty, manque: qty,
            reason: '', reasonNote: '',
            status: 'rupture', manuel: true,
            uploadedBy: session.name, uploadedAt: new Date().toISOString(),
          });
          showToast('✓ Manquant ajouté');
          setManProduit(''); setManProducteur(''); setManQty(''); setShowManual(false);
        } catch (e) { showToast('Erreur : ' + e.message); }
        finally { setBusy(false); }
      };

      // Supprime le dispatch (Master/frais/sec/ND) d'un local
      const handleResetSite = async (site) => {
        if (!confirm(`Supprimer le dispatch chargé pour ${site} ?\n\nCela retire le Master, le dispatch frais, le sec et le ND de ce local. Les manquants et le dispatch dernière minute du jour ne sont PAS touchés.`)) return;
        setBusy(true);
        try {
          await storage.deleteDoc(`day_${day}_dispatch`, site);
          showToast(`✓ Dispatch ${site} supprimé`);
        } catch (e) { showToast('Erreur : ' + e.message); }
        finally { setBusy(false); }
      };

      // Reset complet du dispatch du jour (tous locaux + manquants + lastminute)
      const handleResetAll = async () => {
        if (!confirm(`⚠️ Tout réinitialiser pour la distribution du ${dayLabelShort(day)} ?\n\nCela supprime :\n• les dispatch de TOUS les locaux\n• la liste des manquants\n• les dispatch dernière minute\n\nLes commandes, statuts clients, anomalies qualité ne sont PAS touchés.`)) return;
        if (!confirm('Vraiment sûr ? Action irréversible.')) return;
        setBusy(true);
        try {
          await storage.deleteAll(`day_${day}_dispatch`);
          await storage.deleteAll(`day_${day}_manquants`);
          await storage.deleteAll(`day_${day}_lastminute`);
          showToast('✓ Dispatch du jour réinitialisé');
        } catch (e) { showToast('Erreur : ' + e.message); }
        finally { setBusy(false); }
      };

      const setReason = async (m, reason, note) => {
        await storage.setDoc(`day_${day}_manquants`, m.id, { ...m, reason, reasonNote: note ?? m.reasonNote ?? '' });
      };
      const deleteManquant = async (m) => {
        if (!confirm('Retirer ce manquant ?')) return;
        await storage.deleteDoc(`day_${day}_manquants`, m.id);
      };

      const withReason = manquants.filter(m => m.reason).length;

      return (
        <div className="stack">
          <h1>Dispatch · prépa</h1>

          <div className="card-flat" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:'10px 14px',background:'var(--accent-soft)'}}>
            <div>
              <div style={{fontSize:12,color:'var(--ink-soft)'}}>Distribution du</div>
              <strong style={{fontSize:16,textTransform:'capitalize'}}>📅 {dayLabelShort(day)}</strong>
              <div style={{fontSize:11,color:'var(--ink-mute)',marginTop:2}}>Locaux ce jour : {sitesForDay.join(', ')}</div>
            </div>
            <button className="btn-secondary" onClick={() => { setDay(null); setMasterFile(null); setFraisFile(null); setSecFile(null); setNdFile(null); setManqFiles([]); }} style={{fontSize:13,whiteSpace:'nowrap'}}>
              Changer
            </button>
          </div>

          {/* ============ 1. UPLOAD DISPATCH PAR SITE ============ */}
          <div className="card">
            <h3 style={{marginBottom:8}}>1. Dispatch ({dayLabelShort(day)})</h3>
            <p style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10}}>
              Pour chaque local : <strong>Master</strong>, <strong>Dispatch frais</strong>, <strong>Dispatch sec</strong> (pain) et <strong>ND</strong>.
              Charge un local à la fois.
            </p>
            <label style={{display:'block',fontSize:12,fontWeight:600,marginBottom:4}}>Local concerné</label>
            <select value={dispSite} onChange={e=>setDispSite(e.target.value)} style={{marginBottom:12}}>
              {sitesForDay.map(s => <option key={s} value={s}>{s}{sitesLoaded.includes(s) ? ' ✓' : ''}</option>)}
            </select>
            <label className={`upload-zone ${masterFile ? 'has-file' : ''}`}>
              <input type="file" accept=".pdf,application/pdf,*/*" onChange={e => setMasterFile(e.target.files[0])} />
              <div className="upload-icon">{masterFile ? '✓' : '🗂️'}</div>
              <div style={{fontWeight:500,fontSize:13}}>{masterFile ? masterFile.name : 'Master (casier → client)'}</div>
            </label>
            <label className={`upload-zone ${fraisFile ? 'has-file' : ''}`} style={{marginTop:8}}>
              <input type="file" accept=".pdf,application/pdf,*/*" onChange={e => setFraisFile(e.target.files[0])} />
              <div className="upload-icon">{fraisFile ? '✓' : '🧊'}</div>
              <div style={{fontWeight:500,fontSize:13}}>{fraisFile ? fraisFile.name : 'Dispatch frais'}</div>
            </label>
            <label className={`upload-zone ${secFile ? 'has-file' : ''}`} style={{marginTop:8}}>
              <input type="file" accept=".pdf,application/pdf,*/*" onChange={e => setSecFile(e.target.files[0])} />
              <div className="upload-icon">{secFile ? '✓' : '🍞'}</div>
              <div style={{fontWeight:500,fontSize:13}}>{secFile ? secFile.name : 'Dispatch sec (pain)'}</div>
            </label>
            <label className={`upload-zone ${ndFile ? 'has-file' : ''}`} style={{marginTop:8}}>
              <input type="file" accept=".pdf,application/pdf,*/*" onChange={e => setNdFile(e.target.files[0])} />
              <div className="upload-icon">{ndFile ? '✓' : '✋'}</div>
              <div style={{fontWeight:500,fontSize:13}}>{ndFile ? ndFile.name : 'Non-dispatch (ND)'}</div>
            </label>
            <button className="btn-primary btn-block" disabled={busy || (!masterFile && !fraisFile && !secFile && !ndFile)} onClick={handleUploadDispatch} style={{marginTop:12}}>
              {busy ? 'Lecture des PDF…' : `Charger dispatch ${dispSite}`}
            </button>
            {sitesLoaded.length > 0 && (
              <div className="alert-success" style={{marginTop:10,fontSize:12}}>
                <div style={{marginBottom:6}}>✓ Locaux chargés : {sitesLoaded.join(', ')}</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                  {sitesLoaded.map(s => (
                    <button key={s} className="btn-ghost" disabled={busy}
                      onClick={() => handleResetSite(s)}
                      style={{fontSize:11,padding:'3px 7px',color:'var(--danger)',background:'var(--danger-soft)',borderRadius:4}}>
                      🗑 {s}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* ============ 2. MANQUANTS GLOBAUX ============ */}
          <div className="card">
            <h3 style={{marginBottom:8}}>2. Manquants ({dayLabelShort(day)})</h3>
            <p style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10}}>
              Imprimé de la page dispatch (tous locaux). Chaque produit listé passe <strong>en rupture</strong>.
              Tu peux sélectionner <strong>plusieurs PDF d'un coup</strong> (plusieurs pages).
            </p>
            <label className={`upload-zone ${manqFiles.length ? 'has-file' : ''}`}>
              <input type="file" accept=".pdf,application/pdf,*/*" multiple onChange={e => setManqFiles(Array.from(e.target.files))} />
              <div className="upload-icon">{manqFiles.length ? '✓' : '📄'}</div>
              <div style={{fontWeight:500,fontSize:13}}>
                {manqFiles.length ? `${manqFiles.length} PDF sélectionné${manqFiles.length>1?'s':''}` : 'PDF des manquants (sélection multiple possible)'}
              </div>
              {manqFiles.length > 0 && (
                <div style={{fontSize:11,color:'var(--ink-mute)',marginTop:4}}>{manqFiles.map(f=>f.name).join(', ')}</div>
              )}
            </label>
            <button className="btn-primary btn-block" disabled={busy || !manqFiles.length} onClick={handleUploadManquants} style={{marginTop:10}}>
              {busy ? 'Lecture…' : `Charger les manquants${manqFiles.length>1?` (${manqFiles.length} PDF)`:''}`}
            </button>
            {manquants.length > 0 && (
              <div className="alert-info" style={{marginTop:10,fontSize:12}}>
                {manquants.length} manquants · {withReason} avec raison renseignée
              </div>
            )}

            {/* Ajout manuel d'un manquant */}
            {!showManual ? (
              <button className="btn-ghost btn-block" onClick={() => setShowManual(true)} style={{marginTop:8,fontSize:13}}>
                + Ajouter un manquant à la main
              </button>
            ) : (
              <div className="card-flat" style={{marginTop:10,padding:'12px'}}>
                <div style={{fontWeight:600,fontSize:13,marginBottom:8}}>Nouveau manquant</div>
                <input type="text" placeholder="Produit *" value={manProduit} onChange={e=>setManProduit(e.target.value)} style={{marginBottom:6,fontSize:13}} />
                <input type="text" placeholder="Producteur" value={manProducteur} onChange={e=>setManProducteur(e.target.value)} style={{marginBottom:6,fontSize:13}} />
                <input type="number" min="0" placeholder="Quantité manquante" value={manQty} onChange={e=>setManQty(e.target.value)} style={{marginBottom:8,fontSize:13}} />
                <div style={{display:'flex',gap:6}}>
                  <button className="btn-primary" disabled={busy || !manProduit.trim()} onClick={handleAddManual} style={{flex:1,fontSize:13}}>Ajouter</button>
                  <button className="btn-secondary" onClick={()=>{setShowManual(false);setManProduit('');setManProducteur('');setManQty('');}} style={{fontSize:13}}>Annuler</button>
                </div>
              </div>
            )}
          </div>

          {/* ============ 3. LISTE MANQUANTS + RAISON + TRANSFORM ============ */}
          {manquants.length > 0 && (
            <div className="card">
              <h3 style={{marginBottom:4}}>Produits manquants → ruptures</h3>
              <p style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10}}>
                Renseigne la raison de chacun. Si un produit <strong>arrive</strong>, transforme-le en dispatch dernière minute.
              </p>
