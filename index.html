              {/* Barre de synthèse + filtre rapide */}
              <ManquantsTable
                manquants={manquants}
                lmByManquant={lmByManquant}
                onReason={setReason}
                onDispatch={(m) => setLmModal(m)}
                onDelete={deleteManquant}
              />
            </div>
          )}

          {/* ============ 4. RÉCAP DISPATCH DERNIÈRE MINUTE ============ */}
          {lastmin.length > 0 && (
            <div className="card">
              <h3 style={{marginBottom:8}}>🚚 Dispatch dernière minute du jour</h3>
              <div className="list">
                {lastmin.map(l => {
                  const totalAlloc = Object.values(l.allocBySite || {}).reduce((s, arr) => s + arr.reduce((x,c)=>x+c.qty,0), 0);
                  return (
                    <div key={l.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch',gap:6}}>
                      <div style={{display:'flex',justifyContent:'space-between',gap:8}}>
                        <div className="list-item-name">{l.produit}</div>
                        <button className="btn-ghost" onClick={async()=>{ if(confirm('Annuler ce dispatch ?')) await storage.deleteDoc(`day_${day}_lastminute`, l.id); }} style={{fontSize:13}}>🗑️</button>
                      </div>
                      <div className="list-item-sub">{l.qtyReceived} reçus · {totalAlloc} attribués</div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                        {Object.entries(l.allocBySite || {}).map(([site, arr]) => (
                          <span key={site} className="badge badge-site">{site} : {arr.reduce((x,c)=>x+c.qty,0)}</span>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {(sitesLoaded.length > 0 || manquants.length > 0 || lastmin.length > 0) && (
            <div className="card card-flat" style={{borderColor:'var(--danger-soft)'}}>
              <h3 style={{marginBottom:6,fontSize:14,color:'var(--danger)'}}>⚠️ Réinitialiser</h3>
              <p style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10}}>
                Repartir à zéro pour aujourd'hui : supprime <strong>tous</strong> les dispatch chargés, les manquants et les dispatch dernière minute. Les commandes, statuts clients et anomalies ne sont pas touchés.
              </p>
              <button className="btn-danger btn-block" disabled={busy} onClick={handleResetAll}>
                Tout réinitialiser ({sitesLoaded.length} locaux · {manquants.length} manquants · {lastmin.length} dispatch LM)
              </button>
            </div>
          )}

          {lmModal && (
            <LastMinuteModal
              manquant={lmModal}
              dispatchData={dispatchData}
              session={session}
              day={day}
              onClose={() => setLmModal(null)}
              onSaved={() => { setLmModal(null); showToast('✓ Dispatch dernière minute enregistré'); }}
            />
          )}
        </div>
      );
    }

    // ============================================================
    // MODAL — transformer un manquant en dispatch dernière minute
    // ============================================================
    function LastMinuteModal({ manquant, dispatchData, session, day, onClose, onSaved }) {
      const showToast = React.useContext(ToastContext);
      const [qty, setQty] = React.useState(manquant.manque || 0);
      const [excludeLivdom, setExcludeLivdom] = React.useState(true);
      const [allocMode, setAllocMode] = React.useState('auto'); // 'auto' (prorata) | 'manuel'
      const [alloc, setAlloc] = React.useState({});  // {site: nombre}
      const [busy, setBusy] = React.useState(false);
      // Mode SANS PDF : l'utilisateur choisit les locaux et les quantités à la main.
      const [noPdfAlloc, setNoPdfAlloc] = React.useState({}); // {site: nombre}

      // Besoin par local (depuis les dispatch chargés)
      const needBySite = React.useMemo(() => {
        const exclude = excludeLivdom ? ['DOM'] : [];
        return computeNeedBySite(manquant, dispatchData, { excludeSites: exclude });
      }, [manquant, dispatchData, excludeLivdom]);

      // Proposition au prorata quand qty / besoin change — uniquement en mode auto
      React.useEffect(() => {
        if (allocMode === 'auto') setAlloc(allocateProrata(needBySite, parseInt(qty, 10) || 0));
      }, [needBySite, qty, allocMode]);

      const sites = Object.keys(needBySite);
      const totalNeed = sites.reduce((s, k) => s + needBySite[k].total, 0);
      const totalAlloc = Object.values(alloc).reduce((s, n) => s + (parseInt(n,10)||0), 0);

      const setSiteAlloc = (site, val) => {
        if (allocMode !== 'manuel') setAllocMode('manuel'); // toute saisie passe en manuel
        const n = Math.max(0, Math.min(parseInt(val,10)||0, needBySite[site].total));
        setAlloc(a => ({ ...a, [site]: n }));
      };

      // Met tout le reçu sur un seul local (plafonné à son besoin), 0 ailleurs
      const putAllOn = (target) => {
        setAllocMode('manuel');
        const recu = parseInt(qty,10) || 0;
        const next = {};
        for (const s of sites) next[s] = (s === target) ? Math.min(recu, needBySite[s].total) : 0;
        setAlloc(next);
      };

      // Repasse en prorata auto
      const resetAuto = () => {
        setAllocMode('auto');
        setAlloc(allocateProrata(needBySite, parseInt(qty,10) || 0));
      };

      // Locaux proposés en mode sans-PDF : ceux qui distribuent ce jour (hors DOM si exclu)
      const manualSiteOptions = React.useMemo(() => {
        const list = (typeof sitesForDate === 'function' ? sitesForDate(day) : SITES) || SITES;
        return excludeLivdom ? list.filter(s => s !== 'DOM') : list;
      }, [day, excludeLivdom]);
      const noPdfTotal = Object.values(noPdfAlloc).reduce((s, n) => s + (parseInt(n,10)||0), 0);

      // Sauvegarde en mode SANS PDF : pas de casiers, juste une quantité par local (bac ND)
      const handleSaveNoPdf = async () => {
        if (noPdfTotal <= 0) { showToast('Rien à dispatcher'); return; }
        setBusy(true);
        try {
          const allocBySite = {};
          for (const [site, n] of Object.entries(noPdfAlloc)) {
            const q = parseInt(n,10) || 0;
            if (q > 0) allocBySite[site] = [{ casier: 'ND', qty: q }];
          }
          const id = manquant.id || `lm_${Date.now()}`;
          await storage.setDoc(`day_${day}_lastminute`, id, {
            manquantId: manquant.id,
            produit: manquant.produit, producteur: manquant.producteur, cond: manquant.cond || '',
            qtyReceived: parseInt(qty,10) || 0,
            excludeLivdom,
            allocMode: 'manuel-sans-pdf',
            allocBySite,
            createdBy: session.name, createdAt: new Date().toISOString(),
          });
          if (manquant.id && !manquant.fromSignalement) {
            await storage.setDoc(`day_${day}_manquants`, manquant.id, { ...manquant, status: 'dispatched' });
          }
          onSaved();
        } catch (e) { showToast('Erreur : ' + e.message); }
        finally { setBusy(false); }
      };

      const handleSave = async () => {
        if (totalAlloc <= 0) { showToast('Rien à dispatcher'); return; }
        setBusy(true);
        try {
          // Pour chaque site : attribuer aux casiers dans l'ordre croissant
          const allocBySite = {};
          for (const site of sites) {
            const n = parseInt(alloc[site],10) || 0;
            if (n <= 0) continue;
            allocBySite[site] = attributeToCasiers(needBySite[site].casiers, n);
          }
          const id = manquant.id || `lm_${Date.now()}`;
          await storage.setDoc(`day_${day}_lastminute`, id, {
            manquantId: manquant.id,
            produit: manquant.produit, producteur: manquant.producteur, cond: manquant.cond,
            qtyReceived: parseInt(qty,10) || 0,
            excludeLivdom,
            allocMode,
            allocBySite,
            createdBy: session.name, createdAt: new Date().toISOString(),
          });
          // marque le manquant comme dispatché (sauf si l'item vient d'un signalement bac ND)
          if (manquant.id && !manquant.fromSignalement) {
            await storage.setDoc(`day_${day}_manquants`, manquant.id, { ...manquant, status: 'dispatched' });
          }
          onSaved();
        } catch (e) { showToast('Erreur : ' + e.message); }
        finally { setBusy(false); }
      };

      return (
        <div className="modal-backdrop" onClick={(e) => { if (e.target.className === 'modal-backdrop') onClose(); }}>
          <div className="modal" style={{maxWidth:560}}>
            <div className="modal-header">
              <div>
                <strong style={{fontSize:16}}>🚚 Dispatch dernière minute</strong>
                <div style={{fontSize:13,color:'var(--ink-mute)'}}>{manquant.produit} · {manquant.producteur}</div>
              </div>
              <button className="modal-close" onClick={onClose}>×</button>
            </div>
            <div className="stack" style={{gap:14}}>
              {sites.length === 0 ? (
                <div className="stack" style={{gap:12}}>
                  <div className="alert-warning">
                    <strong>Pas de dispatch chargé pour ce produit.</strong><br/>
                    Tu peux quand même répartir à la main : indique la quantité dispo et combien va dans chaque local.
                  </div>
                  <div>
                    <label style={{display:'block',fontSize:13,fontWeight:600,marginBottom:4}}>Quantité disponible</label>
                    <input type="number" min="0" value={qty} onChange={e => setQty(e.target.value)} style={{fontSize:15}} />
                  </div>
                  <div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6}}>
                      <h3 style={{margin:0,fontSize:14}}>Répartition par local</h3>
                      <span className={noPdfTotal > parseInt(qty,10) ? 'badge badge-danger' : 'badge badge-info'}>
                        {noPdfTotal} / {qty} attribués
                      </span>
                    </div>
                    <div className="stack" style={{gap:6}}>
                      {manualSiteOptions.map(site => (
                        <div key={site} className="card-flat" style={{padding:'8px 12px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
                          <strong>{site}</strong>
                          <input type="number" min="0" value={noPdfAlloc[site] ?? 0}
                            onChange={e => setNoPdfAlloc(a => ({ ...a, [site]: Math.max(0, parseInt(e.target.value,10)||0) }))}
                            style={{width:70,fontSize:14,textAlign:'center'}} />
                        </div>
                      ))}
                    </div>
                    <p style={{fontSize:11,color:'var(--ink-mute)',marginTop:8}}>
                      Sans dispatch chargé, l'app ne connaît pas les clients : ces quantités vont dans le <strong>bac ND</strong> de chaque local, à répartir sur place. Charge les dispatch frais/sec si tu veux l'attribution automatique par client.
                    </p>
                  </div>
                  <button className="btn-primary btn-block" disabled={busy || noPdfTotal<=0} onClick={handleSaveNoPdf}>
                    {busy ? 'Enregistrement…' : `Dispatcher ${noPdfTotal} article${noPdfTotal>1?'s':''}`}
                  </button>
                </div>
              ) : (
                <>
                  <div style={{fontSize:12,color:'var(--ink-mute)'}}>
                    Trouvé dans {sites.length} local{sites.length>1?'aux':''} : {sites.join(', ')}
                  </div>
                  <div>
                    <label style={{display:'block',fontSize:13,fontWeight:600,marginBottom:4}}>Quantité reçue</label>
                    <input type="number" min="0" value={qty} onChange={e => setQty(e.target.value)} style={{fontSize:15}} />
                    <div style={{fontSize:12,color:'var(--ink-mute)',marginTop:4}}>Besoin total (tous locaux) : {totalNeed}</div>
                  </div>

                  <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,cursor:'pointer'}}>
                    <input type="checkbox" checked={excludeLivdom} onChange={e => setExcludeLivdom(e.target.checked)} style={{width:'auto'}} />
                    Exclure la livraison à domicile (DOM)
                  </label>

                  <div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6}}>
                      <h3 style={{margin:0,fontSize:14}}>Répartition par local</h3>
                      <span className={totalAlloc > parseInt(qty,10) ? 'badge badge-danger' : 'badge badge-info'}>
                        {totalAlloc} / {qty} attribués
                      </span>
                    </div>

                    {/* Sélecteur de mode */}
                    <div style={{display:'flex',gap:6,marginBottom:8}}>
                      <button
                        className={allocMode==='auto' ? 'btn-primary' : 'btn-secondary'}
                        onClick={resetAuto}
                        style={{flex:1,fontSize:13,padding:'6px 10px'}}>
                        ⚖️ Prorata auto
                      </button>
                      <button
                        className={allocMode==='manuel' ? 'btn-primary' : 'btn-secondary'}
                        onClick={() => setAllocMode('manuel')}
                        style={{flex:1,fontSize:13,padding:'6px 10px'}}>
                        ✋ Manuel
                      </button>
                    </div>

                    {/* Raccourcis : tout sur un local */}
                    {sites.length > 1 && (
                      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>
                        <span style={{fontSize:12,color:'var(--ink-mute)',alignSelf:'center'}}>Tout sur :</span>
                        {sites.map(site => (
                          <button key={site} className="btn-ghost"
                            onClick={() => putAllOn(site)}
                            style={{fontSize:12,padding:'3px 10px',border:'1px solid var(--border)',borderRadius:6}}>
                            {site}
                          </button>
                        ))}
                      </div>
                    )}

                    <div className="stack" style={{gap:6}}>
                      {sites.map(site => (
                        <div key={site} className="card-flat" style={{padding:'8px 12px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
                          <div>
                            <strong>{site}</strong>
                            <span style={{fontSize:12,color:'var(--ink-mute)',marginLeft:6}}>besoin {needBySite[site].total} · {needBySite[site].casiers.length} casiers</span>
                          </div>
                          <input type="number" min="0" max={needBySite[site].total} value={alloc[site] ?? 0}
                            onChange={e => setSiteAlloc(site, e.target.value)} style={{width:70,fontSize:14,textAlign:'center'}} />
                        </div>
                      ))}
                    </div>
                    <p style={{fontSize:11,color:'var(--ink-mute)',marginTop:8}}>
                      {allocMode==='auto'
                        ? 'Mode prorata : réparti automatiquement au besoin de chaque local. Touche un champ ou « Tout sur » pour passer en manuel.'
                        : 'Mode manuel : tu fixes toi-même les quantités par local. « Prorata auto » recalcule automatiquement.'}
                      {' '}Dans chaque local, l\'app sert les <strong>plus grosses commandes en premier</strong>.
                    </p>
                  </div>

                  <button className="btn-primary btn-block" disabled={busy || totalAlloc<=0} onClick={handleSave}>
                    {busy ? 'Enregistrement…' : `Dispatcher ${totalAlloc} article${totalAlloc>1?'s':''}`}
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // PAGE PRÉPA - saisie produits manquants (matin uniquement)
    // ============================================================
    function PrepPage({ session, products, dispatchData }) {
      const showToast = React.useContext(ToastContext);
      const [prepInfos, setPrepInfos] = React.useState([]);
      const [showForm, setShowForm] = React.useState(false);
      const [editing, setEditing] = React.useState(null);
      const [lmModal, setLmModal] = React.useState(null); // signalement bac ND en cours de dispatch
      // Date cible : aujourd'hui par défaut, mais la prépa peut préparer demain
      const [targetDate, setTargetDate] = React.useState(todayKey());
      // Produits de la date cible (chargés dynamiquement)
      const [targetProducts, setTargetProducts] = React.useState([]);

      // Charger les signalements de la date cible
      React.useEffect(() => {
        const unsub = storage.subscribe(`day_${targetDate}_prep`, setPrepInfos);
        return unsub;
      }, [targetDate]);

      // Charger les produits de la date cible
      React.useEffect(() => {
        if (targetDate === todayKey()) {
          // Pour aujourd'hui, on utilise les produits déjà chargés par le parent
          setTargetProducts(products || []);
          return;
        }
        // Pour une autre date, on charge le catalogue de cette date
        let cancelled = false;
        storage.getAll(`day_${targetDate}_products`).then(arr => {
          if (cancelled) return;
          if (arr.length && arr[0].products) setTargetProducts(arr[0].products);
          else setTargetProducts([]);
        }).catch(() => { if (!cancelled) setTargetProducts([]); });
        return () => { cancelled = true; };
      }, [targetDate, products]);

      const dateLabel = (d) => {
        if (d === todayKey()) return 'Aujourd\'hui';
        if (d === addDays(todayKey(), 1)) return 'Demain';
        return formatDateShort(d);
      };

      const handleDelete = async (id) => {
        if (!confirm('Supprimer ?')) return;
        await storage.deleteDoc(`day_${targetDate}_prep`, id);
        showToast('Supprimé');
      };

      return (
        <div className="stack">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <h1>Préparation</h1>
            <button className="btn-primary" onClick={() => { setEditing(null); setShowForm(true); }}>
              + Signaler
            </button>
          </div>

          {/* Sélecteur de date */}
          <div className="card" style={{background:'var(--accent-soft)',border:'1px solid var(--accent)',padding:12}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>📅 Préparation pour :</div>
            <div className="chip-group">
              <div className={`chip ${targetDate === todayKey() ? 'selected' : ''}`} onClick={() => setTargetDate(todayKey())}>
                Aujourd'hui ({formatDateShort(todayKey())})
              </div>
              <div className={`chip ${targetDate === addDays(todayKey(), 1) ? 'selected' : ''}`} onClick={() => setTargetDate(addDays(todayKey(), 1))}>
                Demain ({formatDateShort(addDays(todayKey(), 1))})
              </div>
              <div className={`chip ${targetDate === addDays(todayKey(), 2) ? 'selected' : ''}`} onClick={() => setTargetDate(addDays(todayKey(), 2))}>
                +2j ({formatDateShort(addDays(todayKey(), 2))})
              </div>
            </div>
            {targetDate !== todayKey() && (
              <div style={{marginTop:6,fontSize:12,color:'var(--ink-soft)'}}>
                Tu prépares les signalements pour <strong>{dateLabel(targetDate)}</strong>. Ils n'apparaîtront chez les distributeurs que ce jour-là.
              </div>
            )}
          </div>

          <p style={{color:'var(--ink-soft)',fontSize:13}}>
            Signale ici les produits avec un problème (manquant, remplacé, etc.). Les distributeurs verront ces infos.
          </p>

          <div className="stat-grid">
            <div className="stat"><div className="stat-value">{prepInfos.length}</div><div className="stat-label">Signalements</div></div>
            <div className="stat"><div className="stat-value">{targetProducts?.length || 0}</div><div className="stat-label">Produits</div></div>
            <div className="stat"><div className="stat-value">{prepInfos.filter(p => p.reason === 'remplace').length}</div><div className="stat-label">Remplacés</div></div>
          </div>

          {prepInfos.length === 0 ? (
            <div className="empty-state"><div className="icon">📦</div><p>Aucun signalement pour {dateLabel(targetDate).toLowerCase()}.</p></div>
          ) : (
            <div className="list">
              {prepInfos.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')).map(p => {
                const reason = PREP_REASONS.find(r => r.id === p.reason);
                return (
                  <div key={p.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div className="list-item-name">📦 {p.productLabel}</div>
                        <div className="list-item-sub">
                          {formatTimeFR(p.createdAt)} · {p.createdBy}
                        </div>
                      </div>
                      <div style={{display:'flex',gap:4}}>
                        <button className="btn-ghost" onClick={() => { setEditing(p); setShowForm(true); }} style={{fontSize:13}}>✏️</button>
                        <button className="btn-ghost" onClick={() => handleDelete(p.id)} style={{fontSize:13}}>🗑️</button>
                      </div>
                    </div>
                    <div style={{marginTop:8}}>
                      <span className="badge badge-anom">{reason?.label || p.reason}</span>
                      {p.discount && <span className="badge badge-info" style={{marginLeft:4}}>Remise {p.discount}%</span>}
                      {p.replacementLabel && <span className="badge badge-info" style={{marginLeft:4}}>→ {p.replacementLabel}</span>}
                    </div>
                    {p.reason === 'livraison_lm' && (
                      <button className="btn-secondary btn-block" style={{marginTop:8,fontSize:13}}
                        onClick={() => {
                          // Construit un "manquant" à la volée à partir du signalement bac ND
                          const label = p.productLabel || '';
                          const m = label.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
                          setLmModal({
                            id: p.id,
                            produit: m ? m[1].trim() : label.trim(),
                            producteur: m ? m[2].trim() : '',
                            cond: '',
                            manque: 0,
                            fromSignalement: true,
                          });
                        }}>
                        🚚 Dispatcher en dernière minute
                      </button>
                    )}
                    {p.note && <div style={{marginTop:6,fontSize:13,fontStyle:'italic',color:'var(--ink-soft)'}}>« {p.note} »</div>}
                  </div>
                );
              })}
            </div>
          )}

          {showForm && (
            <PrepForm products={targetProducts} targetDate={targetDate} session={session} editing={editing} onClose={() => { setShowForm(false); setEditing(null); }} />
          )}

          {lmModal && (
            <LastMinuteModal
              manquant={lmModal}
              dispatchData={dispatchData || {}}
              session={session}
              day={targetDate}
              onClose={() => setLmModal(null)}
              onSaved={() => { setLmModal(null); showToast('✓ Dispatch dernière minute enregistré'); }}
            />
          )}
        </div>
      );
    }

    // === FORM PREP ===
    function PrepForm({ products, targetDate, session, editing, onClose }) {
      const showToast = React.useContext(ToastContext);
      const day = targetDate || todayKey();
      // En édition : un seul produit. En création : tableau de productKeys
      const [isEdit] = React.useState(!!editing);
      const [productKey, setProductKey] = React.useState(editing?.productKey || ''); // mode édition
      const [productKeys, setProductKeys] = React.useState([]); // mode création multi
      const [reason, setReason] = React.useState(editing?.reason || '');
      const [replacementKey, setReplacementKey] = React.useState(editing?.replacementKey || '');
      const [discount, setDiscount] = React.useState(editing?.discount || '');
      const [note, setNote] = React.useState(editing?.note || '');
      const [busy, setBusy] = React.useState(false);

      // Helper pour calculer le label d'un product key
      const computeLabel = (key) => {
        if (!key) return '';
        if (key.startsWith('FREE:')) return key.substring(5);
        const [prod, name] = key.split('|');
        return `${name} (${prod})`;
      };

      const togglePK = (key) => {
        if (!key) return;
        setProductKeys(curr => curr.includes(key) ? curr.filter(k => k !== key) : [...curr, key]);
      };

      const handleSubmit = async () => {
        if (isEdit) {
          if (!productKey) { showToast('Choisis un produit'); return; }
        } else {
          if (productKeys.length === 0) { showToast('Choisis au moins un produit'); return; }
        }
        if (!reason) { showToast('Choisis une raison'); return; }
        setBusy(true);
        try {
          const replacementLabel = computeLabel(replacementKey);
          const baseData = {
            reason,
            replacementKey, replacementLabel,
            discount: parseFloat(discount) || 0,
            note,
            day,
            createdBy: session.name,
            updatedAt: new Date().toISOString(),
          };
          if (isEdit) {
            // Édition : on met à jour un seul signalement
            const productLabel = computeLabel(productKey);
            const data = {
              ...baseData,
              productKey, productLabel,
              createdAt: editing.createdAt,
            };
            await storage.setDoc(`day_${day}_prep`, editing.id, data);
            showToast('✓ Mise à jour');
          } else {
            // Création : on crée un signalement par produit sélectionné
            let count = 0;
            for (const pk of productKeys) {
              const productLabel = computeLabel(pk);
              const id = `prep_${Date.now()}_${Math.random().toString(36).slice(2,7)}_${count}`;
              const data = {
                ...baseData,
                productKey: pk, productLabel,
                createdAt: new Date().toISOString(),
              };
              await storage.setDoc(`day_${day}_prep`, id, data);
              count++;
            }
            showToast(`✓ ${count} signalement${count>1?'s':''} enregistré${count>1?'s':''}`);
          }
          onClose();
        } catch (err) { showToast('Erreur : ' + err.message); }
        finally { setBusy(false); }
      };

      return (
        <div className="modal-backdrop" onClick={(e) => { if (e.target.className === 'modal-backdrop') onClose(); }}>
          <div className="modal">
            <div className="modal-header">
              <h2>{isEdit ? 'Modifier signalement' : 'Signaler produits'}</h2>
              <button className="modal-close" onClick={onClose}>×</button>
            </div>

            {isEdit ? (
              <div className="field">
                <label>Produit concerné</label>
                <ProductPicker products={products} value={productKey} onChange={setProductKey} allowFreetext={true} />
              </div>
            ) : (
              <div className="field">
                <label>Produits concernés ({productKeys.length} sélectionné{productKeys.length>1?'s':''})</label>
                {productKeys.length > 0 && (
                  <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>
                    {productKeys.map(k => (
                      <div key={k} className="chip selected" style={{cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}} onClick={() => togglePK(k)}>
                        <span style={{fontSize:12}}>{computeLabel(k)}</span>
                        <span style={{fontSize:14,fontWeight:'bold'}}>×</span>
                      </div>
                    ))}
                  </div>
                )}
                <MultiProductPicker products={products} selectedKeys={productKeys} onToggle={togglePK} />
              </div>
            )}

            <div className="field">
              <label>Raison {!isEdit && productKeys.length > 1 && '(commune aux produits)'}</label>
              <div className="chip-group">
                {PREP_REASONS.map(r => (
                  <div key={r.id} className={`chip ${reason === r.id ? 'selected' : ''}`} onClick={() => setReason(r.id)}>{r.label}</div>
                ))}
              </div>
            </div>
            {reason === 'remplace' && (
              <div className="field">
                <label>Produit de remplacement</label>
                <ProductPicker products={products} value={replacementKey} onChange={setReplacementKey} allowFreetext={true} />
              </div>
            )}
            {(reason === 'remise_appliquee' || reason === 'remplace') && (
              <div className="field">
                <label>Remise (%)</label>
                <input type="number" min="0" max="100" value={discount} onChange={e => setDiscount(e.target.value)} placeholder="0" />
              </div>
            )}
            <div className="field">
              <label>Note (optionnel)</label>
              <textarea rows={2} value={note} onChange={e => setNote(e.target.value)} placeholder="Précisions…" />
            </div>
            <div className="row">
              <button className="btn-secondary" onClick={onClose}>Annuler</button>
              <button className="btn-primary" disabled={busy} onClick={handleSubmit}>
                {busy ? 'Enregistrement…' : (isEdit ? 'Enregistrer' : `Enregistrer (${productKeys.length})`)}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Picker multi-sélection produits (pour les signalements prépa)
    function MultiProductPicker({ products, selectedKeys, onToggle }) {
      const [search, setSearch] = React.useState('');
      const [freeText, setFreeText] = React.useState('');

      const filtered = React.useMemo(() => {
        if (!products) return [];
        const s = normalizeText(search);
        if (!s) return products.slice(0, 30);
        return products.filter(p =>
          normalizeText(p.produit).includes(s) || normalizeText(p.producteur).includes(s)
        ).slice(0, 50);
      }, [products, search]);

      const addFreeText = () => {
        const t = freeText.trim();
        if (!t) return;
        onToggle(`FREE:${t}`);
        setFreeText('');
      };

      return (
        <div>
          {(!products || products.length === 0) && (
            <div className="alert-warning" style={{padding:10,marginBottom:8,fontSize:12}}>
              ⚠️ Aucun catalogue produit chargé pour cette date. Tu peux quand même saisir les produits en texte libre ci-dessous.
            </div>
          )}
          <div className="search-box">
            <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Chercher un produit…" />
          </div>
          {products && products.length > 0 && (
            <div className="product-list" style={{maxHeight:260}}>
              {filtered.length === 0 ? (
                <div style={{padding: 20, textAlign: 'center', color: 'var(--ink-mute)', fontSize: 13}}>
                  Aucun produit trouvé
                </div>
              ) : filtered.map((p, i) => {
                const key = `${p.producteur}|${p.produit}`;
                const isSelected = selectedKeys.includes(key);
                return (
                  <div key={i} className={`product-item ${isSelected ? 'selected' : ''}`} onClick={() => onToggle(key)} style={isSelected ? {background:'var(--accent-soft)',fontWeight:600} : {}}>
                    <span style={{marginRight:8}}>{isSelected ? '☑' : '☐'}</span>
                    {p.produit} <span style={{color:'var(--ink-mute)',fontSize:12}}>· {p.producteur}{p.unite ? ` · ${p.unite}` : ''}</span>
                  </div>
                );
              })}
            </div>
          )}
          <div style={{display:'flex',gap:6,marginTop:8}}>
            <input type="text" value={freeText} onChange={e => setFreeText(e.target.value)} placeholder="Produit hors liste (texte libre)" style={{flex:1}} />
            <button className="btn-secondary" onClick={addFreeText} disabled={!freeText.trim()} style={{padding:'8px 12px'}}>+ Ajouter</button>
          </div>
        </div>
      );
    }

    // ============================================================
    // PAGE INFOS DU JOUR (visible par tous : distrib voit, prépa voit, master voit)
    // ============================================================
    function InfosPage({ session }) {
      // Suit la distribution du jour (comme la liste clients)
      const day = todayKey();
      const [manquants, setManquants] = React.useState([]);
      const [prepInfos, setPrepInfos] = React.useState([]);
      React.useEffect(() => {
        const u1 = storage.subscribe(`day_${day}_manquants`, setManquants);
        const u2 = storage.subscribe(`day_${day}_prep`, setPrepInfos);
        return () => { u1(); u2(); };
      }, [day]);

      const reasonLabel = (id) => (PREP_REASONS.find(r => r.id === id) || {}).label || (id || '');

      // Fusionne les deux sources dans une forme commune
      const allItems = React.useMemo(() => {
        const fromManq = manquants.map(m => ({
          id: m.id,
          produit: m.produit,
          producteur: m.producteur || '',
          reason: m.reason || '',
          reasonNote: m.reasonNote || '',
          manque: m.manque, total: m.total,
          replacementLabel: '',
          source: 'manq',
        }));
        const fromPrep = prepInfos.map(p => ({
          id: p.id,
          produit: p.productLabel || '',
          producteur: '',
          reason: p.reason || '',
          reasonNote: p.note || '',
          manque: null, total: null,
          replacementLabel: p.replacementLabel || '',
          discount: p.discount || 0,
          source: 'prep',
        }));
        return [...fromManq, ...fromPrep];
      }, [manquants, prepInfos]);

      // Regroupement par raison ; les sans-raison dans un groupe spécial en tête
      const groups = React.useMemo(() => {
        const byReason = {};
        for (const m of allItems) {
          const key = m.reason || '__none__';
          (byReason[key] = byReason[key] || []).push(m);
        }
        const order = ['__none__', ...PREP_REASONS.map(r => r.id)];
        const keys = Object.keys(byReason).sort((a, b) => {
          const ia = order.indexOf(a), ib = order.indexOf(b);
          return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
        });
        return keys.map(k => ({
          key: k,
          label: k === '__none__' ? 'Sans raison renseignée' : reasonLabel(k),
          items: byReason[k].sort((x, y) => (x.produit||'').localeCompare(y.produit||'')),
        }));
      }, [allItems]);

      const isDistrib = isDistribDay(day);

      return (
        <div className="stack">
          <h1>Infos du jour</h1>
          <p style={{color:'var(--ink-soft)',fontSize:13,marginTop:-8}}>
            Produits manquants et leur raison — pour informer les clients.
          </p>

          {!isDistrib ? (
            <div className="empty-state"><div className="icon">📅</div><p>Pas de distribution aujourd'hui.</p></div>
          ) : allItems.length === 0 ? (
            <div className="empty-state"><div className="icon">✅</div><p>Aucun produit manquant signalé aujourd'hui.</p></div>
          ) : (
            <>
              {/* Sommaire : nombre par raison, scannable d'un coup */}
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {groups.map(g => (
                  <span key={g.key} className="badge"
                    style={{
                      fontSize:12, padding:'5px 10px',
                      background: g.key==='__none__' ? 'var(--warn-soft)' : 'var(--bg-muted)',
                      color: g.key==='__none__' ? 'var(--warn)' : 'var(--ink-soft)',
                    }}>
                    {g.label} · {g.items.length}
                  </span>
                ))}
              </div>

              {/* Groupes par raison */}
              {groups.map(g => (
                <div key={g.key} className="card" style={{padding:'12px 14px'}}>
                  <h3 style={{
                    margin:'0 0 10px', fontSize:14,
                    color: g.key==='__none__' ? 'var(--warn)' : 'var(--ink)',
                    display:'flex', alignItems:'center', gap:6,
                  }}>
                    {g.key==='__none__' ? '⚠️' : '•'} {g.label}
                    <span style={{fontWeight:400,color:'var(--ink-mute)',fontSize:12}}>({g.items.length})</span>
                  </h3>
                  <div style={{border:'1px solid var(--line)',borderRadius:'var(--radius-sm)',overflow:'hidden'}}>
                    {g.items.map((m, i) => (
                      <div key={m.source + m.id} style={{
                        display:'flex', alignItems:'center', justifyContent:'space-between', gap:8,
                        padding:'7px 10px', borderTop: i ? '1px solid var(--line)' : 'none',
                      }}>
                        <div style={{minWidth:0}}>
                          <div style={{fontWeight:600,fontSize:13,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.produit}</div>
                          {m.producteur && <div style={{fontSize:11,color:'var(--ink-mute)'}}>{m.producteur}</div>}
                          {m.replacementLabel && <div style={{fontSize:12,color:'var(--info)',marginTop:2}}>→ remplacé par {m.replacementLabel}</div>}
                          {m.reasonNote && (
                            <div style={{fontSize:12,fontStyle:'italic',color:'var(--ink-soft)',marginTop:2}}>« {m.reasonNote} »</div>
                          )}
                        </div>
                        {m.manque != null && (
                          <span className="badge badge-anom" style={{whiteSpace:'nowrap',fontSize:11}}>−{m.manque}/{m.total}</span>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </>
          )}
        </div>
      );
    }

    // ============================================================
    // PAGE STATS (master uniquement)
    // ============================================================
    function StatsPage({ session }) {
      const [allAnomalies, setAllAnomalies] = React.useState([]);
      const [allConsignes, setAllConsignes] = React.useState([]);
      const [allFollowups, setAllFollowups] = React.useState([]);
      const [from, setFrom] = React.useState(() => {
        const d = new Date();
        d.setDate(d.getDate() - 30);
        return d.toISOString().slice(0,10);
      });
      const [to, setTo] = React.useState(() => new Date().toISOString().slice(0,10));

      // Pour les anomalies, on charge depuis Firebase tous les docs "day_*_anomalies"
      // Ici on simplifie en se basant sur le jour J actuel (pour faire mieux il faudrait
      // un index Firestore ; pour l'instant on lit tout ce qu'on a)
      React.useEffect(() => {
        // Charger toutes les collections de la période demandée
        async function loadAll() {
          const anoms = [];
          const start = new Date(from);
          const end = new Date(to);
          for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
            const dk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const arr = await storage.getAll(`day_${dk}_anomalies`);
            anoms.push(...arr.map(a => ({ ...a, _day: dk })));
          }
          setAllAnomalies(anoms);
        }
        loadAll();
        const u1 = storage.subscribe('consignes', setAllConsignes);
        const u2 = storage.subscribe('followups', setAllFollowups);
        return () => { u1(); u2(); };
      }, [from, to]);

      // Stats agrégées
      const anomCountByType = {};
      const anomCountBySite = {};
      for (const a of allAnomalies) {
        for (const t of (a.anomalyTypes || [])) {
          anomCountByType[t] = (anomCountByType[t] || 0) + 1;
        }
        anomCountBySite[a.site] = (anomCountBySite[a.site] || 0) + 1;
      }
      const totalAnoms = allAnomalies.length;
      const totalRefund = allAnomalies.reduce((s, a) => s + (a.amountRefund || 0), 0);
      const totalCredit = allAnomalies.reduce((s, a) => s + (a.amountCredit || 0), 0);

      const consignesInRange = allConsignes.filter(c => c.day >= from && c.day <= to);
      const totalPots = consignesInRange.reduce((s, c) => s + (c.nbPots || 0), 0);
      const potsCredited = consignesInRange.filter(c => c.status === 'credited').reduce((s, c) => s + (c.nbPots || 0), 0);

      const fuInRange = allFollowups.filter(f => (f.distribDate || f.day) >= from && (f.distribDate || f.day) <= to);
      const fuResolved = fuInRange.filter(f => f.status === 'resolved').length;

      const renderBars = (data) => {
        const max = Math.max(...Object.values(data), 1);
        return (
          <div className="bar-chart">
            {Object.entries(data).sort((a,b) => b[1] - a[1]).map(([k, v]) => {
              const def = ANOMALIES.find(x => x.id === k);
              const label = def ? def.label : k;
              return (
                <div key={k} className="bar-row">
                  <div className="bar-label">{label}</div>
                  <div className="bar-track"><div className="bar-fill" style={{width: `${(v/max)*100}%`}}></div></div>
                  <div className="bar-value">{v}</div>
                </div>
              );
            })}
          </div>
        );
      };

      return (
        <div className="stack">
          <h1>Statistiques</h1>
          <p style={{color:'var(--ink-soft)',fontSize:13,marginTop:-8}}>Choisis ta plage de dates.</p>

          <div className="card">
            <div className="date-range">
              <div style={{flex:1}}>
                <label>Du</label>
                <input type="date" value={from} onChange={e => setFrom(e.target.value)} />
              </div>
              <div style={{flex:1}}>
                <label>Au</label>
                <input type="date" value={to} onChange={e => setTo(e.target.value)} />
              </div>
            </div>
          </div>

          <h3>Qualité</h3>
          <div className="stat-grid">
            <div className="stat"><div className="stat-value">{totalAnoms}</div><div className="stat-label">Anomalies</div></div>
            <div className="stat"><div className="stat-value">{totalRefund.toFixed(0)}€</div><div className="stat-label">Remb.</div></div>
            <div className="stat"><div className="stat-value">{totalCredit.toFixed(0)}€</div><div className="stat-label">Avoirs</div></div>
          </div>

          {totalAnoms > 0 && (
            <>
              <div className="card">
                <h3 style={{marginBottom:10}}>Anomalies par type</h3>
                {renderBars(anomCountByType)}
              </div>
              <div className="card">
                <h3 style={{marginBottom:10}}>Anomalies par site</h3>
                <div className="bar-chart">
                  {Object.entries(anomCountBySite).sort((a,b) => b[1] - a[1]).map(([k, v]) => (
                    <div key={k} className="bar-row">
                      <div className="bar-label">{k}</div>
                      <div className="bar-track"><div className="bar-fill" style={{width: `${(v/Math.max(...Object.values(anomCountBySite),1))*100}%`}}></div></div>
                      <div className="bar-value">{v}</div>
                    </div>
                  ))}
                </div>
              </div>
            </>
          )}

          <h3>Consignes</h3>
          <div className="stat-grid">
            <div className="stat"><div className="stat-value">{consignesInRange.length}</div><div className="stat-label">Dépôts</div></div>
            <div className="stat"><div className="stat-value">{totalPots}</div><div className="stat-label">Pots</div></div>
            <div className="stat"><div className="stat-value">{potsCredited}</div><div className="stat-label">Crédités</div></div>
          </div>

          <h3>Non-récup</h3>
          <div className="stat-grid">
            <div className="stat"><div className="stat-value">{fuInRange.length}</div><div className="stat-label">Total</div></div>
            <div className="stat"><div className="stat-value">{fuResolved}</div><div className="stat-label">Résolus</div></div>
            <div className="stat"><div className="stat-value">{fuInRange.length > 0 ? Math.round(fuResolved/fuInRange.length*100) : 0}%</div><div className="stat-label">Taux</div></div>
          </div>
        </div>
      );
    }

    // ============================================================
    // PAGE PERTES (préparateur)
    // ============================================================
    function LossesPage({ session, catalogue, catalogueMeta }) {
      const showToast = React.useContext(ToastContext);
      const [losses, setLosses] = React.useState([]);
      const [sentWeeks, setSentWeeks] = React.useState([]);
      const [showForm, setShowForm] = React.useState(false);
      const [editing, setEditing] = React.useState(null);
      const [busy, setBusy] = React.useState(false);

      const week = currentWeek();

      React.useEffect(() => {
        const unsub = storage.subscribe('losses', setLosses);
        const unsub2 = storage.subscribe('losses_sent', setSentWeeks);
        return () => { unsub(); unsub2(); };
      }, []);

      // Cette semaine a-t-elle déjà été envoyée ?
      const alreadySent = sentWeeks.find(s => s.id === week.monday);

      // Pertes de la semaine courante
      const weekLosses = losses.filter(l => l.day >= week.monday && l.day <= week.friday);
      const allTimeLosses = losses;

      const jeteWeek = weekLosses.filter(l => l.destination === 'jete');
      const pribonWeek = weekLosses.filter(l => l.destination === 'pribon');
      const totalJete = jeteWeek.reduce((s, l) => s + (l.totalValue || 0), 0);
      const totalPribon = pribonWeek.reduce((s, l) => s + (l.totalValue || 0), 0);
      const totalWeek = totalJete + totalPribon;

      const handleDelete = async (id) => {
        if (!confirm('Supprimer cette entrée ?')) return;
        await storage.deleteDoc('losses', id);
        showToast('Supprimée');
      };

      const [pdfGenerated, setPdfGenerated] = React.useState(false);
      const [confirmingSent, setConfirmingSent] = React.useState(false);

      const handleSendToManager = async () => {
        if (weekLosses.length === 0) { showToast('Aucune perte cette semaine'); return; }
        if (!window.jspdf) { showToast('PDF non disponible, recharge la page'); return; }
        setBusy(true);
        try {
          // Générer le PDF
          const sorted = [...weekLosses].sort((a, b) => (a.day || '').localeCompare(b.day || ''));
          const doc = generateLossesPDF(sorted, week);
          const filename = `Pertes_Kelbongoo_S${week.monday}.pdf`;

          // Sauvegarder le PDF (téléchargement direct)
          doc.save(filename);

          // Ouvrir le client mail avec destinataire pré-rempli
          const subject = encodeURIComponent(`Pertes Kelbongoo · Semaine du ${formatDateShort(week.mondayDate)} - Total : ${totalWeek.toFixed(2)}€`);
          const body = encodeURIComponent(
            `Bonjour,\n\n` +
            `Rapport hebdomadaire des pertes en pièce jointe (déjà téléchargé sur ton ordinateur).\n\n` +
            `Récap :\n` +
            `- Jetées : ${jeteWeek.length} entrées · ${totalJete.toFixed(2)} €\n` +
            `- Envoyé Pribon ROB : ${pribonWeek.length} entrées · ${totalPribon.toFixed(2)} €\n` +
            `- TOTAL valorisé : ${totalWeek.toFixed(2)} €\n\n` +
            `Merci de joindre le PDF téléchargé.\n\n` +
            `${session.name}\n` +
            `Préparation Kelbongoo`
          );
          window.location.href = `mailto:${MANAGER_EMAIL}?subject=${subject}&body=${body}`;
          setPdfGenerated(true);
          showToast('PDF généré · ouvre ta messagerie');
        } catch (e) {
          showToast('Erreur : ' + e.message);
        } finally { setBusy(false); }
      };

      const handleConfirmSent = async () => {
        if (!confirm('Confirmer que le mail a bien été envoyé ?\n\nCela va archiver les pertes de la semaine et vider l\'affichage.')) return;
        setConfirmingSent(true);
        try {
          // Archiver les données dans Firebase (collection "losses_archive") avant suppression
          const archiveId = `archive_${week.monday}_${Date.now()}`;
          await storage.setDoc('losses_archive', archiveId, {
            week_monday: week.monday,
            week_friday: week.friday,
            sentBy: session.name,
            sentAt: new Date().toISOString(),
            totalJete, totalPribon, totalWeek,
            countJete: jeteWeek.length,
            countPribon: pribonWeek.length,
            losses: JSON.stringify(weekLosses), // archive complète
          });
          // Marquer la semaine comme envoyée
          await storage.setDoc('losses_sent', `${week.monday}`, {
            week_monday: week.monday,
            week_friday: week.friday,
            sentBy: session.name,
            sentAt: new Date().toISOString(),
            totalJete, totalPribon,
            count: weekLosses.length,
          });
          // Supprimer les entrées de la semaine
          for (const l of weekLosses) {
            await storage.deleteDoc('losses', l.id);
          }
          setPdfGenerated(false);
          showToast(`✓ ${weekLosses.length} entrée(s) archivée(s)`);
        } catch (e) {
          showToast('Erreur : ' + e.message);
        } finally { setConfirmingSent(false); }
      };

      return (
        <div className="stack">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <h1>Pertes</h1>
            <button className="btn-primary" disabled={!catalogue || catalogue.length === 0} onClick={() => { setEditing(null); setShowForm(true); }}>
              + Ajouter
            </button>
          </div>
          <p style={{color:'var(--ink-soft)',fontSize:13,marginTop:-8}}>
            Semaine du <strong>{formatDateShort(week.mondayDate)} au {formatDateShort(week.fridayDate)}</strong>.
            Saisie possible toute la semaine, envoi vendredi.
          </p>

          {alreadySent && (
            <div className="alert-success">
              ✓ Cette semaine a déjà été envoyée au gérant par {alreadySent.sentBy} le {formatDateShort(alreadySent.sentAt)} à {formatTimeFR(alreadySent.sentAt)}.
              <br/><small>Tu peux quand même ajouter des entrées en retard et renvoyer si nécessaire.</small>
            </div>
          )}

          {(!catalogue || catalogue.length === 0) ? (
            <div className="alert-warning">
              ⚠️ Le catalogue complet n'est pas chargé. Va dans <strong>Admin</strong> pour uploader le CSV catalogue complet (à faire chaque vendredi).
            </div>
          ) : catalogueMeta && (
            <div className="alert-success" style={{fontSize:12,padding:'8px 12px'}}>
              ✓ Catalogue chargé : {catalogue.length} produits · MAJ il y a {daysSince(catalogueMeta.uploadedAt)}j
            </div>
          )}

          <div className="stat-grid">
            <div className="stat"><div className="stat-value">{weekLosses.length}</div><div className="stat-label">Cette semaine</div></div>
            <div className="stat"><div className="stat-value" style={{color:'var(--danger)'}}>{totalJete.toFixed(0)}€</div><div className="stat-label">Jeté</div></div>
            <div className="stat"><div className="stat-value" style={{color:'var(--info)'}}>{totalPribon.toFixed(0)}€</div><div className="stat-label">Pribon ROB</div></div>
          </div>

          {totalWeek > 0 && (
            <div className="card" style={{background:'var(--master-soft)',border:'1px solid var(--master)'}}>
              <h3 style={{color:'var(--master)',marginBottom:8}}>Total semaine : {totalWeek.toFixed(2)} €</h3>

              {!pdfGenerated ? (
                <>
                  <button className="btn-primary btn-block btn-lg" disabled={busy} onClick={handleSendToManager}>
                    {busy ? 'Génération…' : '📧 1. Générer PDF et ouvrir mail'}
                  </button>
                  <div style={{fontSize:11,color:'var(--ink-soft)',marginTop:8,textAlign:'center'}}>
                    Le PDF est téléchargé, ton client mail s'ouvre avec destinataire et message pré-remplis.<br/>
                    Il te restera à joindre le PDF dans le mail et cliquer "Envoyer".
                  </div>
                </>
              ) : (
                <>
                  <div className="alert-success" style={{marginBottom:12}}>
                    ✓ PDF généré et téléchargé.<br/>
                    Une fois le mail bien envoyé au gérant, clique sur le bouton ci-dessous.
                  </div>
                  <div className="row" style={{display:'flex',gap:6}}>
                    <button className="btn-secondary" onClick={() => setPdfGenerated(false)} style={{flex:1}}>
                      Annuler
                    </button>
                    <button className="btn-primary btn-lg" disabled={confirmingSent} onClick={handleConfirmSent} style={{flex:2}}>
                      {confirmingSent ? 'Archivage…' : '✅ 2. Confirmer envoi (vider l\'écran)'}
                    </button>
                  </div>
                  <button className="btn-ghost btn-block" onClick={handleSendToManager} disabled={busy} style={{marginTop:8,fontSize:12}}>
                    🔄 Re-générer le PDF / re-ouvrir le mail
                  </button>
                </>
              )}
            </div>
          )}

          <h3 style={{marginTop:16}}>Entrées de la semaine</h3>
          {weekLosses.length === 0 ? (
            <div className="empty-state"><div className="icon">🗑️</div><p>Aucune perte enregistrée cette semaine.</p></div>
          ) : (
            <div className="list">
              {weekLosses.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')).map(l => {
                const reasonDef = LOSS_REASONS.find(r => r.id === l.reason);
                const destDef = LOSS_DESTINATIONS.find(d => d.id === l.destination);
                return (
                  <div key={l.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div className="list-item-name">{l.produit}</div>
                        <div className="list-item-sub">
                          {l.producteur} · {formatDateShort(l.day)} · {l.createdBy}
                        </div>
                      </div>
                      <div style={{display:'flex',gap:4}}>
                        <button className="btn-ghost" onClick={() => { setEditing(l); setShowForm(true); }} style={{fontSize:13}}>✏️</button>
                        <button className="btn-ghost" onClick={() => handleDelete(l.id)} style={{fontSize:13}}>🗑️</button>
                      </div>
                    </div>
                    <div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:4,alignItems:'center'}}>
                      <span className={`badge badge-${destDef?.color === 'danger' ? 'danger' : 'info'}`}>{destDef?.label}</span>
                      <span className="badge badge-anom">{reasonDef?.label}</span>
                      <span style={{fontSize:13,color:'var(--ink-soft)',marginLeft:4}}>
                        {l.usingWeight ? `${l.weight} kg` : `${l.quantity} u`} × {(l.unitPrice || 0).toFixed(2)}€ = <strong>{(l.totalValue || 0).toFixed(2)}€</strong>
                      </span>
                    </div>
                    {l.remark && <div style={{marginTop:6,fontSize:13,fontStyle:'italic',color:'var(--ink-soft)'}}>« {l.remark} »</div>}
                  </div>
                );
              })}
            </div>
          )}

          {showForm && (
            <LossForm
              catalogue={catalogue}
              session={session}
              editing={editing}
              onClose={() => { setShowForm(false); setEditing(null); }}
            />
          )}
        </div>
      );
    }

    // === FORM PERTE ===
    function LossForm({ catalogue, session, editing, onClose }) {
      const showToast = React.useContext(ToastContext);
      const [productKey, setProductKey] = React.useState(editing?.productKey || '');
      const [destination, setDestination] = React.useState(editing?.destination || 'jete');
      const [reason, setReason] = React.useState(editing?.reason || '');
      const [usingWeight, setUsingWeight] = React.useState(editing?.usingWeight || false);
      const [quantity, setQuantity] = React.useState(editing?.quantity || '1');
      const [weight, setWeight] = React.useState(editing?.weight || '');
      const [remark, setRemark] = React.useState(editing?.remark || '');
      const [busy, setBusy] = React.useState(false);

      const selectedProduct = (catalogue || []).find(p => `${p.producteur}|${p.produit}` === productKey);
      // Prix d'achat en euros (le CSV stocke en centimes /100)
      const unitPrice = selectedProduct ? (selectedProduct.prixAchat || selectedProduct.prixHT || 0) : 0;
      const qtyValue = usingWeight ? parseFloat(weight) || 0 : parseFloat(quantity) || 0;
      const totalValue = unitPrice * qtyValue;

      const handleSubmit = async () => {
        if (!productKey) { showToast('Choisis un produit'); return; }
        if (!reason) { showToast('Choisis une raison'); return; }
        if (usingWeight && !weight) { showToast('Indique le poids'); return; }
        if (!usingWeight && !quantity) { showToast('Indique la quantité'); return; }
        setBusy(true);
        try {
          const id = editing?.id || `loss_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
          const data = {
            productKey,
            producteur: selectedProduct?.producteur || '',
            produit: selectedProduct?.produit || '',
            unite: selectedProduct?.unite || '',
            destination, reason,
            usingWeight,
            quantity: usingWeight ? 0 : parseFloat(quantity) || 0,
            weight: usingWeight ? parseFloat(weight) || 0 : 0,
            unitPrice,
            totalValue,
            remark,
            day: todayKey(),
            createdBy: session.name,
            createdAt: editing?.createdAt || new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          };
          await storage.setDoc('losses', id, data);
          showToast(editing ? '✓ Mise à jour' : '✓ Perte enregistrée');
          onClose();
        } catch (err) { showToast('Erreur : ' + err.message); }
        finally { setBusy(false); }
      };

      return (
        <div className="modal-backdrop" onClick={(e) => { if (e.target.className === 'modal-backdrop') onClose(); }}>
          <div className="modal">
            <div className="modal-header">
              <h2>{editing ? 'Modifier perte' : 'Nouvelle perte'}</h2>
              <button className="modal-close" onClick={onClose}>×</button>
            </div>
            <div className="field">
              <label>Produit (catalogue complet)</label>
              <ProductPicker products={catalogue} value={productKey} onChange={setProductKey} allowFreetext={false} />
            </div>

            {selectedProduct && (
              <div className="alert-info" style={{marginBottom: 12, fontSize: 12}}>
                💰 Prix d'achat : <strong>{unitPrice.toFixed(2)} €</strong> / {selectedProduct.unite}
              </div>
            )}

            <div className="field">
              <label>Destination</label>
              <div className="chip-group">
                {LOSS_DESTINATIONS.map(d => (
                  <div key={d.id} className={`chip chip-${d.color} ${destination === d.id ? 'selected' : ''}`} onClick={() => setDestination(d.id)}>{d.label}</div>
                ))}
              </div>
            </div>

            <div className="field">
              <label>Raison</label>
              <div className="chip-group">
                {LOSS_REASONS.map(r => (
                  <div key={r.id} className={`chip ${reason === r.id ? 'selected' : ''}`} onClick={() => setReason(r.id)}>{r.label}</div>
                ))}
              </div>
            </div>

            <div className="field">
              <label>Saisie en</label>
              <div className="chip-group">
                <div className={`chip ${!usingWeight ? 'selected' : ''}`} onClick={() => setUsingWeight(false)}>Quantité (unités)</div>
                <div className={`chip ${usingWeight ? 'selected' : ''}`} onClick={() => setUsingWeight(true)}>Poids (kg)</div>
              </div>
            </div>

            {usingWeight ? (
              <div className="field">
                <label>Poids (kg)</label>
                <input type="number" step="0.01" min="0" value={weight} onChange={e => setWeight(e.target.value)} placeholder="0.00" />
              </div>
            ) : (
              <div className="field">
                <label>Quantité</label>
                <input type="number" min="1" value={quantity} onChange={e => setQuantity(e.target.value)} />
              </div>
            )}

            {totalValue > 0 && (
              <div className="alert-success" style={{marginBottom:12,padding:'10px 12px'}}>
                <strong>Valeur :</strong> {qtyValue} {usingWeight ? 'kg' : 'u'} × {unitPrice.toFixed(2)}€ = <strong>{totalValue.toFixed(2)} €</strong>
              </div>
            )}

            <div className="field">
              <label>Remarque (optionnel)</label>
              <textarea rows={2} value={remark} onChange={e => setRemark(e.target.value)} placeholder="Précisions…" />
            </div>

            <div className="row">
              <button className="btn-secondary" onClick={onClose}>Annuler</button>
              <button className="btn-primary" disabled={busy} onClick={handleSubmit}>
                {busy ? 'Enregistrement…' : 'Enregistrer'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // PAGE ADMIN
    // ============================================================
    function AdminPage({ session, ordersMeta, productsMeta, consumersMeta, catalogueMeta }) {
      const showToast = React.useContext(ToastContext);
      const [csvFile, setCsvFile] = React.useState(null);
      const [productsFile, setProductsFile] = React.useState(null);
      const [consumersFile, setConsumersFile] = React.useState(null);
      const [catalogueFile, setCatalogueFile] = React.useState(null);
      const [busy, setBusy] = React.useState(false);
      // Date cible pour les uploads (par défaut : aujourd'hui)
      const [targetDate, setTargetDate] = React.useState(todayKey());

      // Helpers pour les boutons de date rapide
      const dateLabel = (d) => {
        if (d === todayKey()) return 'Aujourd\'hui';
        if (d === addDays(todayKey(), 1)) return 'Demain';
        return formatDateShort(d);
      };

      const handleUploadCSV = async () => {
        if (!csvFile) { showToast('Sélectionne un CSV'); return; }
        setBusy(true);
        try {
          const csvText = await csvFile.text();
          // Compter les différents statuts avant filtrage pour information
          const allParsed = Papa.parse(csvText, {
            header: true, delimiter: ';', skipEmptyLines: true,
            transformHeader: h => h.trim().replace(/^\uFEFF/, ''),
          });
          const statusCount = {};
          for (const r of (allParsed.data || [])) {
            const s = (r.Status || '').trim().toLowerCase();
            if (s) statusCount[s] = (statusCount[s] || 0) + 1;
          }
          // Parser proprement (uniquement 'compilée' est gardé)
          const orders = parseOrdersCSV(csvText);
          await storage.setDoc(`day_${targetDate}_orders`, 'data', {
            orders, uploadedBy: session.name,
            uploadedAt: new Date().toISOString(),
            count: orders.length,
            statusCount,
            targetDate,
          });
          // Message détaillé
          const ignored = Object.entries(statusCount)
            .filter(([s]) => s !== 'compilée' && s !== 'compilee')
            .map(([s, n]) => `${n} ${s}`)
            .join(', ');
          const dateInfo = targetDate === todayKey() ? '' : ` (pour ${dateLabel(targetDate)})`;
          if (ignored) {
            showToast(`✓ ${orders.length} commandes${dateInfo} · ignorées : ${ignored}`);
          } else {
            showToast(`✓ ${orders.length} commandes${dateInfo}`);
          }
          setCsvFile(null);
        } catch (e) { showToast('Erreur : ' + e.message); }
        finally { setBusy(false); }
      };

      const handleUploadProducts = async () => {
        if (!productsFile) { showToast('Sélectionne un CSV'); return; }
        setBusy(true);
        try {
          const csvText = await productsFile.text();
          const products = parseProductsCSV(csvText);
          await storage.setDoc(`day_${targetDate}_products`, 'data', {
            products, uploadedBy: session.name,
            uploadedAt: new Date().toISOString(),
            count: products.length,
            targetDate,
          });
          const dateInfo = targetDate === todayKey() ? '' : ` (pour ${dateLabel(targetDate)})`;
          showToast(`✓ ${products.length} produits${dateInfo}`);
          setProductsFile(null);
        } catch (e) { showToast('Erreur : ' + e.message); }
        finally { setBusy(false); }
      };

      const handleUploadConsumers = async () => {
        if (!consumersFile) { showToast('Sélectionne un JSON'); return; }
        if (!session.isMaster) { showToast('Master uniquement'); return; }
        setBusy(true);
        try {
          const text = await consumersFile.text();
          const byEmail = parseConsumersJSON(text);
          const total = Object.keys(byEmail).length;
          const CHUNK_SIZE = 5000;
          const entries = Object.entries(byEmail);
          const chunks = [];
          for (let i = 0; i < entries.length; i += CHUNK_SIZE) {
            const chunk = {};
            for (const [email, data] of entries.slice(i, i + CHUNK_SIZE)) chunk[email] = data;
            chunks.push(chunk);
          }
          showToast(`Chargement en ${chunks.length} parties…`);
          const existing = await storage.getAll('consumers_cache');
          for (const e of existing) await storage.deleteDoc('consumers_cache', e.id);
          for (let i = 0; i < chunks.length; i++) {
            await storage.setDoc('consumers_cache', `chunk_${String(i).padStart(3, '0')}`, {
              data: JSON.stringify(chunks[i]),
              chunkIndex: i, chunkCount: chunks.length,
            });
            showToast(`Partie ${i+1}/${chunks.length}…`);
          }
          await storage.setDoc('consumers_meta', 'meta', {
            uploadedBy: session.name, uploadedAt: new Date().toISOString(),
            count: total, chunkCount: chunks.length,
          });
          showToast(`✓ ${total} consommateurs`);
          setConsumersFile(null);
        } catch (e) { showToast('Erreur : ' + e.message); }
        finally { setBusy(false); }
      };

      const handleUploadCatalogue = async () => {
        if (!catalogueFile) { showToast('Sélectionne un CSV'); return; }
        setBusy(true);
        try {
          const csvText = await catalogueFile.text();
          const catalogue = parseCatalogueCSV(csvText);
          await storage.setDoc('catalogue', 'data', {
            catalogue,
            data: JSON.stringify(catalogue), // chunk pour éviter limite index
            uploadedBy: session.name,
            uploadedAt: new Date().toISOString(),
            count: catalogue.length,
          });
          showToast(`✓ ${catalogue.length} produits catalogue`);
          setCatalogueFile(null);
        } catch (e) { showToast('Erreur : ' + e.message); }
        finally { setBusy(false); }
      };

      const consumersAge = consumersMeta ? daysSince(consumersMeta.uploadedAt) : null;
      const consumersStale = consumersAge !== null && consumersAge >= 7;
      const catalogueAge = catalogueMeta ? daysSince(catalogueMeta.uploadedAt) : null;
      const catalogueStale = catalogueAge !== null && catalogueAge >= 7;

      return (
        <div className="stack">
          <h1>Administration</h1>

          {/* Sélecteur de date cible pour les uploads */}
          <div className="card" style={{background:'var(--accent-soft)',border:'1px solid var(--accent)'}}>
            <h3 style={{marginBottom:8}}>📅 Date cible des uploads</h3>
            <p style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10}}>
              Sélectionne pour quel jour tu uploades. La prépa peut anticiper la veille sans casser la distribution en cours.
            </p>
            <div className="chip-group">
              <div className={`chip ${targetDate === todayKey() ? 'selected' : ''}`} onClick={() => setTargetDate(todayKey())}>
                Aujourd'hui ({formatDateShort(todayKey())})
              </div>
              <div className={`chip ${targetDate === addDays(todayKey(), 1) ? 'selected' : ''}`} onClick={() => setTargetDate(addDays(todayKey(), 1))}>
                Demain ({formatDateShort(addDays(todayKey(), 1))})
              </div>
              <div className={`chip ${targetDate === addDays(todayKey(), 2) ? 'selected' : ''}`} onClick={() => setTargetDate(addDays(todayKey(), 2))}>
                +2j ({formatDateShort(addDays(todayKey(), 2))})
              </div>
            </div>
            <div style={{marginTop:8,fontSize:12}}>
              <input
                type="date"
                value={targetDate}
                onChange={e => setTargetDate(e.target.value || todayKey())}
                style={{padding:'4px 6px',borderRadius:6,border:'1px solid var(--line)'}}
              />
            </div>
            {targetDate !== todayKey() && (
              <div className="alert-warning" style={{marginTop:8,padding:8,fontSize:12}}>
                ⚠️ Les uploads commandes & produits ci-dessous seront stockés pour <strong>{dateLabel(targetDate)} ({formatDateShort(targetDate)})</strong>, pas pour aujourd'hui.
              </div>
            )}
          </div>

          {/* CSV commandes */}
          <div className="card">
            <h3 style={{marginBottom:8}}>1. Commandes (CSV)</h3>
            <p style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10}}>
              Pour <strong>{dateLabel(targetDate)} ({formatDateShort(targetDate)})</strong>.
            </p>
            {ordersMeta && (
              <div className="alert-success" style={{marginBottom:10}}>
                ✓ {ordersMeta.count} commandes · par {ordersMeta.uploadedBy} à {formatTimeFR(ordersMeta.uploadedAt)}
              </div>
            )}
            <label className={`upload-zone ${csvFile ? 'has-file' : ''}`}>
              <input type="file" accept=".csv,text/csv,text/comma-separated-values,application/csv,application/vnd.ms-excel,*/*" onChange={e => setCsvFile(e.target.files[0])} />
              <div className="upload-icon">{csvFile ? '✓' : '📄'}</div>
              <div style={{fontWeight:500,fontSize:13}}>{csvFile ? csvFile.name : 'Choisir le CSV des commandes'}</div>
            </label>
            <button className="btn-primary btn-block" disabled={busy || !csvFile} onClick={handleUploadCSV} style={{marginTop:10}}>
              {busy ? 'Chargement…' : 'Charger commandes'}
            </button>
          </div>

          {/* CSV produits */}
          <div className="card">
            <h3 style={{marginBottom:8}}>2. Produits (CSV totaux-détail)</h3>
            <p style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10}}>
              Pour <strong>{dateLabel(targetDate)} ({formatDateShort(targetDate)})</strong>. Permet de choisir les produits dans les anomalies.
            </p>
            {productsMeta && (
              <div className="alert-success" style={{marginBottom:10}}>
                ✓ {productsMeta.count} produits · par {productsMeta.uploadedBy} à {formatTimeFR(productsMeta.uploadedAt)}
              </div>
            )}
            <label className={`upload-zone ${productsFile ? 'has-file' : ''}`}>
              <input type="file" accept=".csv,text/csv,text/comma-separated-values,application/csv,application/vnd.ms-excel,*/*" onChange={e => setProductsFile(e.target.files[0])} />
              <div className="upload-icon">{productsFile ? '✓' : '📦'}</div>
              <div style={{fontWeight:500,fontSize:13}}>{productsFile ? productsFile.name : 'Choisir le CSV produits'}</div>
            </label>
            <button className="btn-primary btn-block" disabled={busy || !productsFile} onClick={handleUploadProducts} style={{marginTop:10}}>
              {busy ? 'Chargement…' : 'Charger produits'}
            </button>
          </div>

          {/* JSON consumers : MASTER ONLY */}
          {session.isMaster ? (
            <div className="card">
              <h3 style={{marginBottom:8}}>3. Base consommateurs (Master seulement)</h3>
              <p style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10}}>
                À mettre à jour <strong>chaque lundi</strong> pour avoir les téléphones à jour.
              </p>
              {consumersMeta && (
                <div className={consumersStale ? 'alert-red' : 'alert-success'} style={{marginBottom:10, padding: 10, fontSize: 13}}>
                  {consumersStale ? '⚠️ ' : '✓ '}
                  {consumersMeta.count} clients · uploadé il y a {consumersAge}j
                  {consumersStale && <><br/>Pense à mettre à jour !</>}
                </div>
              )}
              <label className={`upload-zone ${consumersFile ? 'has-file' : ''}`}>
                <input type="file" accept=".json,application/json,text/json,*/*" onChange={e => setConsumersFile(e.target.files[0])} />
                <div className="upload-icon">{consumersFile ? '✓' : '👥'}</div>
                <div style={{fontWeight:500,fontSize:13}}>{consumersFile ? consumersFile.name : 'Choisir le JSON consumers'}</div>
              </label>
              <button className="btn-primary btn-block" disabled={busy || !consumersFile} onClick={handleUploadConsumers} style={{marginTop:10}}>
                {busy ? 'Chargement…' : 'Charger base'}
              </button>
            </div>
          ) : (
            consumersMeta && (
              <div className="card card-flat">
                <h3 style={{marginBottom:8}}>Base consommateurs</h3>
                <div style={{fontSize:13,color:'var(--ink-soft)'}}>
                  {consumersMeta.count} clients · MAJ il y a {consumersAge}j
                </div>
              </div>
            )
          )}

          {/* CSV catalogue complet (pour les pertes) */}
          <div className="card">
            <h3 style={{marginBottom:8}}>4. Catalogue complet (Pertes)</h3>
            <p style={{fontSize:12,color:'var(--ink-soft)',marginBottom:10}}>
              CSV de <strong>tous</strong> les produits Kelbongoo. À mettre à jour <strong>chaque vendredi</strong>.
              Sert à saisir les pertes (qui peuvent concerner des produits absents de la distribution du jour).
            </p>
            {catalogueMeta && (
              <div className={catalogueStale ? 'alert-warning' : 'alert-success'} style={{marginBottom:10, padding: 10, fontSize: 13}}>
                {catalogueStale ? '⚠️ ' : '✓ '}
                {catalogueMeta.count} produits · uploadé il y a {catalogueAge}j
                {catalogueStale && <><br/>Pense à mettre à jour ce vendredi !</>}
              </div>
            )}
            <label className={`upload-zone ${catalogueFile ? 'has-file' : ''}`}>
              <input type="file" accept=".csv,text/csv,text/comma-separated-values,application/csv,application/vnd.ms-excel,*/*" onChange={e => setCatalogueFile(e.target.files[0])} />
              <div className="upload-icon">{catalogueFile ? '✓' : '📚'}</div>
              <div style={{fontWeight:500,fontSize:13}}>{catalogueFile ? catalogueFile.name : 'Choisir le CSV catalogue complet'}</div>
            </label>
            <button className="btn-primary btn-block" disabled={busy || !catalogueFile} onClick={handleUploadCatalogue} style={{marginTop:10}}>
              {busy ? 'Chargement…' : 'Charger catalogue'}
            </button>
          </div>

          <div className="card card-flat">
            <h3 style={{marginBottom:8}}>Infos</h3>
            <div style={{fontSize:12,color:'var(--ink-soft)',lineHeight:1.6}}>
              <strong>Mode :</strong> {session.role}<br/>
              <strong>Firebase :</strong> {firebaseConfigured ? 'connecté' : 'local'}<br/>
              <strong>Sites :</strong> {SITES.join(', ')}<br/>
              <strong>Alerte non-récup :</strong> +{ALERT_DAYS_NON_RECUP}j
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // APP ROOT
    // ============================================================
    function App() {
      const [session, setSession] = React.useState(() => {
        const saved = sessionStorage.getItem('kb_session_v2');
        return saved ? JSON.parse(saved) : null;
      });
      const [tab, setTab] = React.useState('clients');
      const [currentSite, setCurrentSite] = React.useState(null);

      const [rawOrders, setRawOrders] = React.useState([]);
      const [ordersMeta, setOrdersMeta] = React.useState(null);
      const [products, setProducts] = React.useState([]);
      const [productsMeta, setProductsMeta] = React.useState(null);
